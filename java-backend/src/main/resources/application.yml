server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://optonto-mysql:${DB_PORT:3306}/${DB_NAME:onto_material}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:onto123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
