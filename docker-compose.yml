networks:
  optonto-net:
    driver: bridge

services:
  # ─── Agent 后端 (pi-agent-core) ──────────────────────────────────
  optonto-agent-backend:
    build:
      context: ./agent-backend
      dockerfile: Dockerfile
    image: optonto-agent-backend
    container_name: optonto-agent-backend
    ports:
      - "8003:8003"
    depends_on:
      - optonto-core-backend
    volumes:
      # .data 目录（读写，权限由 PathAccessController 代码层控制）
      - ./.data:/app/.data
      # 共享配置（DEEPSEEK_API_KEY 等）
      - ./config:/app/config
    env_file:
      - ./config/.env
    environment:
      - TZ=Asia/Shanghai
      - DATA_DIR=/app/.data
      - THREADS_DIR=/app/.data/threads
      - MEMORY_DIR=/app/.data/memory
      - PORT=8003
      - MCP_CONFIG_PATH=/app/config/mcp-config.json
      # 内置本体查询 MCP 地址（内置对外工具面之一，只读查询）
      - MCP_BUILTIN_URL=http://optonto-ontology-query-mcp:8002/mcp
      # 内置公共函数 MCP 地址（内置固定项，与本体查询 MCP 同权：恒存在/恒启用/恒全选）
      - MCP_BUILTIN_COMMON_FUNCTION_URL=http://optonto-common-function-mcp:8007/mcp
    networks:
      - optonto-net

  # ─── MySQL 数据库 ────────────────────────────────────────────
  optonto-mysql:
    image: mysql:8.0
    container_name: optonto-mysql
    ports:
      - "3307:3306"
    env_file:
      - ./config/.env
    environment:
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - optonto-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Java 后端 (Spring Boot) ─────────────────────────────────
  optonto-business-backend:
    build:
      context: ./business-backend
      dockerfile: Dockerfile
    image: optonto-business-backend
    container_name: optonto-business-backend
    ports:
      - "8080:8080"
    depends_on:
      optonto-mysql:
        condition: service_healthy
    env_file:
      - ./config/.env
    environment:
      TZ: Asia/Shanghai
    networks:
      - optonto-net

  # ─── 前端 (纯 Next.js，经 optonto-nginx 对外) ────────────────────
  optonto-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: optonto-frontend
    container_name: optonto-frontend
    expose:
      - "3000"
    depends_on:
      - optonto-core-backend
    networks:
      - optonto-net

  # ─── Nginx 入口（全站唯一对外端口 :81） ─────────────────────────
  optonto-nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: optonto-nginx
    container_name: optonto-nginx
    ports:
      - "81:81"
    depends_on:
      - optonto-frontend
      - optonto-core-backend
      - optonto-agent-backend
    networks:
      - optonto-net

  # ─── 后端 API (FastAPI，纯设计面) ──────────────────────────────
  optonto-core-backend:
    build:
      context: .
      dockerfile: core-backend/Dockerfile
    image: optonto-core-backend
    container_name: optonto-core-backend
    ports:
      - "8001:8001"
    volumes:
      - ./.data:/app/.data
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
      # 运行面转发目标（core 运行期执行归零，/behaviors/call 与函数 execute 降级转发）
      - DATA_ENGINE_EXECUTOR_URL=http://optonto-data-engine-executor:8005
      - ONTOLOGY_FUNCTION_EXECUTOR_URL=http://optonto-ontology-function-executor:8006
      - COMMON_FUNCTION_MCP_URL=http://optonto-common-function-mcp:8007
    networks:
      - optonto-net

  # ─── 本体查询 MCP 服务（内置对外工具面之一：只发布 list* 只读查询，无执行职责）──
  optonto-ontology-query-mcp:
    build:
      context: .
      dockerfile: ontology-query-mcp/Dockerfile
    image: optonto-ontology-query-mcp
    container_name: optonto-ontology-query-mcp
    ports:
      - "8002:8002"
    volumes:
      - ./.data:/app/.data
    environment:
      - DATA_DIR=/app/.data
      - TZ=Asia/Shanghai
    networks:
      - optonto-net

  # ─── 公共函数 MCP 服务（平台通用算力：发布 + 执行一体，自包含）────────────────
  # 对外：/mcp 发布 7 个公共函数工具（filterData/aggregateData/dateDiff 等，跨本体共享）
  # 与本体函数的处理刻意不同：公共函数无本体归属、执行是纯内存计算，故"发布什么就执行什么"；
  # 本体函数有归属、对外需按本体切片，故其执行底座不对外（见下一服务）。
  optonto-common-function-mcp:
    build:
      context: .
      dockerfile: common-function-mcp/Dockerfile
    image: optonto-common-function-mcp
    container_name: optonto-common-function-mcp
    ports:
      - "8007:8007"
    volumes:
      - ./.data:/app/.data
    environment:
      - DATA_DIR=/app/.data
      - TZ=Asia/Shanghai
    networks:
      - optonto-net
  # ─── 本体函数执行服务（函数执行唯一实现；零工具、仅内网、不发布端口）────────────
  # 对外：不挂 /mcp 与 /sse（transport=none），外部误连直接 404
  # 调用方：core 设计器测试按钮 + 自建发布（函数类）转发
  optonto-ontology-function-executor:
    build:
      context: .
      dockerfile: ontology-function-executor/Dockerfile
    image: optonto-ontology-function-executor
    container_name: optonto-ontology-function-executor
    volumes:
      - ./.data:/app/.data
    environment:
      - DATA_DIR=/app/.data
      - TZ=Asia/Shanghai
    networks:
      - optonto-net

  # ─── 数据引擎执行服务（行为/引擎执行唯一实现；零工具执行底座）────────────────
  # 对外：不发布宿主端口、不经 nginx 代理（外部客户端连不到）
  # 协议面：transport=none，不挂 /mcp、/sse（行为工具的唯一出口是自建发布）
  # 调用方：core 设计器测试转发 + 自建发布（行为类）转发（都是 REST /call-*）
  optonto-data-engine-executor:
    build:
      context: .
      dockerfile: data-engine-executor/Dockerfile
    image: optonto-data-engine-executor
    container_name: optonto-data-engine-executor
    volumes:
      - ./.data:/app/.data
    env_file:
      - ./config/.env
    environment:
      - DATA_DIR=/app/.data
      - TZ=Asia/Shanghai
    networks:
      - optonto-net

  # ─── 业务系统 MCP（模拟外部业务系统；业务侧集成边缘）────────────────────────
  # 启停管控：与其他固定服务同权（页面可启停，白名单键 business）；
  # 仍不配 restart 策略——它是"外部依赖"，掉了不该被平台自动拉起（重启由人在页面/ Docker 决定）。
  optonto-business-mcp:
    build:
      context: .
      dockerfile: business-mcp/Dockerfile
    image: optonto-business-mcp
    container_name: optonto-business-mcp
    ports:
      - "8004:8004"
    environment:
      - BUSINESS_API_BASE=http://optonto-business-backend:8080
      - TZ=Asia/Shanghai
    networks:
      - optonto-net

  # ─── 自建发布 MCP 镜像（动态容器的唯一镜像；平时不运行，只提供镜像）──────────
  # 一个镜像 N 个实例：用户在「MCP发布」页创建发布时，由 core-backend 用 docker SDK
  # 起容器（配置经环境变量注入、零挂载），宿主端口取 8020-8099 段。
  # 因此本服务只声明 build + profile：docker compose --profile published-mcp build optonto-published-mcp
  # 一次性构建出镜像后，动态创建即可秒级完成。
  optonto-mcp-publish:
    build:
      context: .
      dockerfile: mcp-publish/Dockerfile
    image: optonto-mcp-publish
    profiles: ["published-mcp"]
    networks:
      - optonto-net

volumes:
  mysql_data:
