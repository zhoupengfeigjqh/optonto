networks:
  optonto-net:
    driver: bridge

services:
  # ─── MySQL 数据库 ────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: optonto_mysql
    ports:
      - "3307:3306"
    env_file:
      - ./config/.env
    environment:
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - optonto-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Java 后端 (Spring Boot) ─────────────────────────────────
  java-backend:
    build:
      context: ./java-backend
      dockerfile: Dockerfile
    container_name: optonto_java_backend
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ./config/.env
    environment:
      TZ: Asia/Shanghai
    networks:
      - optonto-net

  # ─── 前端 (Nginx + Next.js 合并) ───────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: optonto_frontend
    ports:
      - "81:81"
    depends_on:
      - backend
    networks:
      - optonto-net

  # ─── 后端 API (FastAPI) ────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: optonto_backend
    ports:
      - "8001:8001"
    volumes:
      - ./backend/.data:/app/backend/.data
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
    networks:
      - optonto-net

  # ─── MCP 服务 (常驻 SSE) ───────────────────────────────────────
  mcp:
    build:
      context: .
      dockerfile: backend/Dockerfile.mcp
    container_name: optonto_mcp
    ports:
      - "8002:8002"
    depends_on:
      - backend
    volumes:
      - ./backend/.data:/app/backend/.data
    environment:
      - API_BASE_URL=http://optonto_backend:8001
      - TZ=Asia/Shanghai
    command: >
      sh -c "python -m uvicorn mcp_server_sse:starlette_app --host 0.0.0.0 --port 8002"
    networks:
      - optonto-net

volumes:
  mysql_data:
