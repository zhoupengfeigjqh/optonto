networks:
  optonto-net:
    driver: bridge

services:
  # ─── Agent 后端 (pi-agent-core) ──────────────────────────────────
  optonto-agent-backend:
    build:
      context: ./agent-backend
      dockerfile: Dockerfile
    image: optonto-agent-backend
    container_name: optonto-agent-backend
    ports:
      - "8003:8003"
    depends_on:
      - optonto-core-backend
    volumes:
      # .data 目录（读写，权限由 PathAccessController 代码层控制）
      - ./.data:/app/.data
      # 共享配置（DEEPSEEK_API_KEY 等）
      - ./config:/app/config
    env_file:
      - ./config/.env
    environment:
      - TZ=Asia/Shanghai
      - DATA_DIR=/app/.data
      - THREADS_DIR=/app/.data/threads
      - MEMORY_DIR=/app/.data/memory
      - PORT=8003
      - MCP_CONFIG_PATH=/app/config/mcp-config.json
      # 内置本体MCP 地址（默认同为该值，显式写出便于切换环境时一眼看到）
      - MCP_BUILTIN_URL=http://optonto-ontology-mcp:8002/sse
      # 内置数据引擎MCP 地址（行为 facade 唯一入口）
      - MCP_BUILTIN_DATA_ENGINE_URL=http://optonto-data-engine-mcp:8005/sse
    networks:
      - optonto-net

  # ─── MySQL 数据库 ────────────────────────────────────────────
  optonto-mysql:
    image: mysql:8.0
    container_name: optonto-mysql
    ports:
      - "3307:3306"
    env_file:
      - ./config/.env
    environment:
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - optonto-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Java 后端 (Spring Boot) ─────────────────────────────────
  optonto-business-backend:
    build:
      context: ./business-backend
      dockerfile: Dockerfile
    image: optonto-business-backend
    container_name: optonto-business-backend
    ports:
      - "8080:8080"
    depends_on:
      optonto-mysql:
        condition: service_healthy
    env_file:
      - ./config/.env
    environment:
      TZ: Asia/Shanghai
    networks:
      - optonto-net

  # ─── 前端 (纯 Next.js，经 optonto-nginx 对外) ────────────────────
  optonto-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: optonto-frontend
    container_name: optonto-frontend
    expose:
      - "3000"
    depends_on:
      - optonto-core-backend
    networks:
      - optonto-net

  # ─── Nginx 入口（全站唯一对外端口 :81） ─────────────────────────
  optonto-nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: optonto-nginx
    container_name: optonto-nginx
    ports:
      - "81:81"
    depends_on:
      - optonto-frontend
      - optonto-core-backend
      - optonto-agent-backend
    networks:
      - optonto-net

  # ─── 后端 API (FastAPI，纯设计面) ──────────────────────────────
  optonto-core-backend:
    build:
      context: .
      dockerfile: core-backend/Dockerfile
    image: optonto-core-backend
    container_name: optonto-core-backend
    ports:
      - "8001:8001"
    volumes:
      - ./.data:/app/.data
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
      # 运行面转发目标（core 运行期执行归零，/behaviors/call 与函数 execute 降级转发）
      - DATA_ENGINE_MCP_URL=http://optonto-data-engine-mcp:8005
      - ONTOLOGY_MCP_URL=http://optonto-ontology-mcp:8002
    networks:
      - optonto-net

  # ─── 本体 MCP 服务（list* 查询 + 本体/公共函数沙箱，直读 .data）──────────────
  optonto-ontology-mcp:
    build:
      context: .
      dockerfile: ontology-mcp/Dockerfile
    image: optonto-ontology-mcp
    container_name: optonto-ontology-mcp
    ports:
      - "8002:8002"
    volumes:
      - ./.data:/app/.data
    environment:
      - DATA_DIR=/app/.data
      - TZ=Asia/Shanghai
    networks:
      - optonto-net

  # ─── 数据引擎 MCP 服务（行为 facade + 映射执行 + SQL，直读 .data）────────────
  optonto-data-engine-mcp:
    build:
      context: .
      dockerfile: data-engine-mcp/Dockerfile
    image: optonto-data-engine-mcp
    container_name: optonto-data-engine-mcp
    ports:
      - "8005:8005"
    volumes:
      - ./.data:/app/.data
    env_file:
      - ./config/.env
    environment:
      - DATA_DIR=/app/.data
      - TZ=Asia/Shanghai
    networks:
      - optonto-net

  # ─── 业务 MCP 服务（模拟业务系统；业务侧集成边缘，非平台内置）────────────────
  # 启停管控：只能 Docker 手动启停（docker start/stop），不进前端启停白名单，
  # 故不配 restart 策略（默认不自动拉起，由人控制）。
  optonto-business-mcp:
    build:
      context: .
      dockerfile: business-mcp/Dockerfile
    image: optonto-business-mcp
    container_name: optonto-business-mcp
    ports:
      - "8004:8004"
    environment:
      - BUSINESS_API_BASE=http://optonto-business-backend:8080
      - TZ=Asia/Shanghai
    networks:
      - optonto-net

volumes:
  mysql_data:
