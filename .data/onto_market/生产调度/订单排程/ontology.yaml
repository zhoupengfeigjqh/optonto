rules:
- name: OrderTypeValid
  description: 订单明细.类型 只能是询单或销售二选一
  behavior: CreateOrder
  related_functions: []
  display_name: 订单类型校验
  position: 前置
  data_supplements: []
- name: ProductExistsValid
  description: 订单明细.货品编号和货品名称 必须存在于 货品
  behavior: CreateOrder
  related_functions: []
  display_name: 货品存在性校验
  position: ''
  data_supplements: []
- name: DueDateValid
  description: 订单明细.截止日期 > 订单明细.起排日期
  behavior: CreateOrder
  related_functions: []
  display_name: 截止日期约束
  position: ''
  data_supplements: []
- name: QtyValid
  description: 订单明细.交付数量 > 0
  behavior: CreateOrder
  related_functions: []
  display_name: 交付数量约束
  position: ''
  data_supplements: []
- name: PriorityValid
  description: 订单明细.优先级 只能是按期交付或可延期交付
  behavior: CreateOrder
  related_functions: []
  display_name: 优先级约束
  position: ''
  data_supplements: []
- name: NoSchedOnUpdate
  description: 订单更新时，该订单必须未创建排产任务，否则拒绝
  behavior: UpdateOrder
  related_functions: []
  display_name: 未排产约束（更新）
  position: ''
  data_supplements: []
- name: NoSchedOnDelete
  description: 订单删除时，该订单必须未创建排产任务，否则拒绝
  behavior: DeleteOrder
  related_functions: []
  display_name: 未排产约束（删除）
  position: ''
  data_supplements: []
- name: SchedUniqueValid
  description: 创建排产任务时，该订单只能创建一次排产任务
  behavior: CreateSchedTask
  related_functions: []
  display_name: 排产唯一性约束
  position: ''
  data_supplements: []
- name: AddSchedStateValid
  description: 新增排产任务时，排产任务状态需为已排产
  behavior: AddSchedTask
  related_functions: []
  display_name: 新增任务状态约束
  position: ''
  data_supplements: []
- name: StartSchedStateValid
  description: 启动排产任务时，该任务还未开启过排产
  behavior: StartSchedTask
  related_functions: []
  display_name: 启动任务状态约束
  position: ''
  data_supplements: []
- name: DeployStateValid
  description: 排产结果下发时，排产任务为已排产，方案状态为未锁定
  behavior: DeploySchedResult
  related_functions: []
  display_name: 下发状态约束
  position: ''
  data_supplements: []
- name: RecallStateValid
  description: 排产结果撤回时，方案状态为已下发
  behavior: RecallSchedResult
  related_functions: []
  display_name: 撤回状态约束
  position: ''
  data_supplements: []
- name: CanAddAfterSched
  description: 排产任务.任务状态=已排产 -> 可新增场景任务
  behavior: QuerySchedTask
  related_functions: []
  display_name: 已排产可新增任务
  position: ''
  data_supplements: []
- name: PromptSchedAfterOrder
  description: 订单创建成功 -> 提示可对该订单创建排产任务
  behavior: CreateOrder
  related_functions: []
  display_name: 创建后提示排产
  position: ''
  data_supplements: []
- name: PromptWaitAfterStart
  description: 排产任务启动 -> 提示等待结果
  behavior: StartSchedTask
  related_functions: []
  display_name: 启动后提示等待
  position: ''
  data_supplements: []
processes: []
