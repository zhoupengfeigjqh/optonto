relations:
- name: hasProductInventory
  source: Product
  target: ProductInv
  cardinality: '1:1'
  description: 每个货品对应一条库存快照
  display_name: 关联库存
- name: hasBOM
  source: Product
  target: BOMInfo
  cardinality: '1:1'
  description: 1个货品有1个BOM
  display_name: 包含BOM
- name: hasBOMDetail
  source: BOMInfo
  target: BOMDetail
  cardinality: 1:N
  description: 1个BOM含多个BOM明细项
  display_name: 包含明细
- name: refersToProduct
  source: BOMDetail
  target: Product
  cardinality: N:1
  description: 1个BOM明细项有1个货品
  display_name: 指向货品
- name: hasRoute
  source: BOMDetail
  target: ProcessRoute
  cardinality: N:1
  description: 1个BOM明细项对应1条工艺路径
  display_name: 关联工艺
- name: requiresMaterial
  source: BOMInfo
  target: BOMMaterialReq
  cardinality: 1:N
  description: 1个BOM可包含多个原料需求
  display_name: 需要原料
- name: requiresEquipGroup
  source: BOMInfo
  target: BOMEquipReq
  cardinality: 1:N
  description: 1个BOM可包含多个设备组需求
  display_name: 需要设备组
- name: requiresPersonGroup
  source: BOMInfo
  target: BOMPersonReq
  cardinality: 1:N
  description: 1个BOM可包含多个人组需求
  display_name: 需要人员组
- name: routeRequiresMat
  source: ProcessRoute
  target: RouteMaterialReq
  cardinality: 1:N
  description: 1条工艺路径可关联多个原料需求
  display_name: 需要原料
- name: routeRequiresEquip
  source: ProcessRoute
  target: RouteEquipReq
  cardinality: 1:N
  description: 1条工艺路径可关联多个设备组需求
  display_name: 需要设备组
- name: routeRequiresPerson
  source: ProcessRoute
  target: RoutePersonReq
  cardinality: 1:N
  description: 1条工艺路径可关联多个人组需求
  display_name: 需要人员组
behaviors:
- name: QueryProduct
  description: 用户或智能体查询货品基本信息
  params:
    productId:
      type: string
      required: true
    productName:
      type: string
      required: true
  related_concepts:
  - Product
  display_name: 查询货品信息
- name: QueryProductInv
  description: 用户或智能体查询货品库存
  params:
    productId: string
    productName: string
  related_concepts:
  - ProductInv
  display_name: 查询货品库存
- name: QueryBOMInfo
  description: 用户或智能体查询BOM基本信息
  params:
    bomId: string
    productId: string
  related_concepts:
  - BOMInfo
  display_name: 查询BOM信息
- name: QueryBOMMaterialReq
  description: 用户或智能体查询BOM的原料汇总需求
  params:
    bomId: string
  related_concepts:
  - BOMMaterialReq
  display_name: 查询BOM原料需求
- name: QueryBOMEquipReq
  description: 用户或智能体查询BOM的设备组汇总需求
  params:
    bomId: string
  related_concepts:
  - BOMEquipReq
  display_name: 查询BOM设备需求
- name: QueryBOMPersonReq
  description: 用户或智能体查询BOM的人员组汇总需求
  params:
    bomId: string
  related_concepts:
  - BOMPersonReq
  display_name: 查询BOM人员需求
- name: QueryBOMDetail
  description: 用户或智能体查询BOM及其明细和工艺路径
  params:
    bomId: string
  related_concepts:
  - BOMDetail
  display_name: 查询BOM明细
- name: QueryProcessRoute
  description: 用户或智能体查询工艺路径及其关联资源需求
  params:
    routeId: string
    routeName: string
  related_concepts:
  - ProcessRoute
  display_name: 查询工艺路径
- name: QueryRouteMatReq
  description: 用户或智能体查询工艺路径关联的原料需求
  params:
    routeId: string
  related_concepts:
  - RouteMaterialReq
  display_name: 查询工艺原料需求
- name: QueryRouteEquipReq
  description: 用户或智能体查询工艺路径关联的设备组需求
  params:
    routeId: string
  related_concepts:
  - RouteEquipReq
  display_name: 查询工艺设备需求
- name: QueryRoutePersonReq
  description: 用户或智能体查询工艺路径关联的人员组需求
  params:
    routeId: string
  related_concepts:
  - RoutePersonReq
  display_name: 查询工艺人员需求
rules:
- name: PromptAfterBOMQuery
  description: 查询BOM基本信息后，提示可进一步查询原料/设备组/人员组需求
  related_behaviors:
  - QueryBOMInfo
  display_name: 查询BOM后引导
  rule_type: 推理规则
  position: 后置
- name: PromptAfterBOMDetailQuery
  description: 查询BOM明细后，提示可查询对应工艺路径的资源需求
  related_behaviors:
  - QueryBOMDetail
  display_name: 查询BOM明细后引导
  rule_type: 推理规则
  position: 后置
events: []
