  - CustomerOrder
  params:
    purchaseRecord:
      type: object
      display_name: 采购记录
      properties:
        purchaseRecordId:
          type: string
          display_name: 采购单号
          example: PO-20231027-001
          required: true
        orderId:
          type: string
          display_name: 关联订单编号（可为空）
          example: SO-20231001-001
          required: true
      required: true
  response:
    result:
      type: object
      properties:
        purchaseRecordId:
          type: string
          display_name: 采购单号
          example: PO-20231027-001
        purchasePurpose:
          type: string
          display_name: 采购目的
          example: 订单驱动
  code_file: functions/inferPurchasePurpose.py
