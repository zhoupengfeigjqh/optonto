processes:
- name: purchaseDemandTriggerAndCreateFlow
  display_name: 采购需求触发与采购单创建流程
  goal: 从采购需求产生（客户订单驱动或安全库存预警）到创建采购单，确保采购需求被正确响应
  description: 当客户订单产生采购需求或库存低于安全库存时，评估供应商供货能力，选择合适的供应源，创建采购单
  steps:
  - current_action: queryRawMaterialInventory
    previous_action: ''
    description: 查询原材料库存，获取可用库存量
    connection_type: 串行
  - current_action: queryRawMaterial
    previous_action: queryRawMaterialInventory
    description: 查询原材料基本信息，获取安全库存阈值
    connection_type: 串行
  - current_action: querySupplyCapacity
    previous_action: queryRawMaterial
    description: 查询供应商供货能力，评估可选供应源
    connection_type: 串行
  - current_action: createPurchaseRecord
    previous_action: querySupplyCapacity
    description: 创建采购单，关联原材料、供应商和客户订单
    connection_type: 串行
- name: purchaseArrivalAndInboundFlow
  display_name: 采购到货与入库流程
  goal: 确认原材料到货并完成入库，更新库存快照
  description: 当采购单到位时间到达时，确认到货并执行入库操作，更新原材料库存信息
  steps:
  - current_action: queryPurchaseRecord
    previous_action: ''
    description: 查询采购单信息，确认到位时间和到货状态
    connection_type: 串行
  - current_action: confirmInbound
    previous_action: queryPurchaseRecord
    description: 确认原材料到货，执行入库操作
    connection_type: 串行
  - current_action: queryRawMaterialInventory
    previous_action: confirmInbound
    description: 查询更新后的库存快照，确认库存状态
    connection_type: 串行
- name: inventoryMonitoringAndAlertFlow
  display_name: 库存监控与预警流程
  goal: 实时监控库存状态，触发安全库存预警和采购超期预警
  description: 定期或按需查询库存与采购单信息，通过规则判断是否触发预警，提示用户采取相应措施
  steps:
  - current_action: queryRawMaterialInventory
    previous_action: ''
    description: 查询原材料库存信息，获取可用库存量
    connection_type: 串行
  - current_action: queryPurchaseRecord
    previous_action: queryRawMaterialInventory
    description: 查询采购单信息，检查到位时间与关联订单状态
    connection_type: 并行
  - current_action: queryRawMaterial
    previous_action: queryRawMaterialInventory
    description: 查询原材料基本信息，获取安全库存阈值
    connection_type: 并行
