concepts:
- name: RawMaterial
  description: 原材料概念，表示生产所需的原材料
  attributes:
  - name: rawMaterialId
    type: string
    display_name: 原材料ID
    example: RM001
  - name: rawMaterialName
    type: string
    display_name: 原材料名称
    example: 高强度钢板
  display_name: 原材料
  instance_label: ''
- name: RawMaterialInventory
  description: 原材料库存快照概念，表示原材料的最新库存状态
  attributes:
  - name: rawMaterialId
    type: string
    display_name: 原材料ID
    example: RM001
  - name: stockQuantity
    type: number
    display_name: 库存数量
    example: '500'
    constraint:
      unique: false
      required: false
      enum: []
      pattern: ''
      min: 0.0
  display_name: 原材料库存快照
  instance_label: ''
- name: PurchaseRecord
  description: 采购记录概念，表示一次采购活动的记录
  attributes:
  - name: purchaseRecordId
    type: string
    display_name: 采购记录ID
    example: PR001
  - name: rawMaterialId
    type: string
    display_name: 原材料ID
    example: RM001
  - name: supplierId
    type: string
    display_name: 供应商ID
    example: SUP001
  - name: orderId
    type: string
    display_name: 客户订单ID
    example: ORD001
  display_name: 采购记录
  instance_label: ''
- name: Supplier
  description: 供应商概念，表示提供原材料的供应商
  attributes:
  - name: supplierId
    type: string
    display_name: 供应商ID
    example: SUP001
  - name: supplierName
    type: string
    display_name: 供应商名称
    example: 某某钢铁有限公司
  display_name: 供应商
  instance_label: ''
- name: CustomerOrder
  description: 客户订单概念，表示客户的订单
  attributes:
  - name: orderId
    type: string
    display_name: 客户订单ID
    example: ORD001
  display_name: 客户订单
  instance_label: ''
- name: SupplyCapacity
  description: 供货能力概念，表示供应商对某种原材料的供货能力
  attributes:
  - name: supplyCapacityId
    type: string
    display_name: 供货能力ID
    example: SC001
  - name: supplierId
    type: string
    display_name: 供应商ID
    example: SUP001
  - name: rawMaterialId
    type: string
    display_name: 原材料ID
    example: RM001
  display_name: 供货能力
  instance_label: ''
relations:
- name: hasRawInventory
  source: RawMaterial
  target: RawMaterialInventory
  cardinality: '1:1'
  source_attr: rawMaterialId
  target_attr: rawMaterialId
  description: 每个原材料对应一条最新的库存快照，用于实时反映该原材料的库存状态
  display_name: 拥有库存快照
- name: recordsRawMaterial
  source: PurchaseRecord
  target: RawMaterial
  cardinality: N:1
  source_attr: rawMaterialId
  target_attr: rawMaterialId
  description: 1条采购记录只采购1种原材料，1种原材料可被多条采购记录采购
  display_name: 采购记录对应原材料
- name: orderedFromSupplier
  source: PurchaseRecord
  target: Supplier
  cardinality: N:1
  source_attr: supplierId
  target_attr: supplierId
  description: 1条采购记录只向1个供应商采购，1个供应商可被多条采购记录关联
  display_name: 向供应商采购
- name: suppliesRawMaterial
  source: Supplier
  target: RawMaterial
  cardinality: N:M
  source_attr: supplierId
  target_attr: rawMaterialId
  description: 1个供应商可供应多种原材料，1种原材料可来源于多个供应商
  display_name: 供应原材料
- name: containsPurchaseRecord
  source: CustomerOrder
  target: PurchaseRecord
  cardinality: 1:N
  source_attr: orderId
  target_attr: orderId
  description: 1个客户订单可关联多条采购记录，1条采购记录最多只关联1个客户订单（orderId可为空表示补充库存）
  display_name: 包含采购记录
- name: providedBySupplier
  source: SupplyCapacity
  target: Supplier
  cardinality: N:1
  source_attr: supplierId
  target_attr: supplierId
  description: 1条供货能力记录只属于1个供应商，1个供应商可有多条供货能力记录
  display_name: 由供应商提供
- name: suppliesMaterial
  source: SupplyCapacity
  target: RawMaterial
  cardinality: N:1
  source_attr: rawMaterialId
  target_attr: rawMaterialId
  description: 1条供货能力记录只对应1种原材料，1种原材料可有多条供货能力记录
  display_name: 对应原材料
functions:
- name: checkSafetyStock
  display_name: 检查安全库存
  description: 比较指定原材料的库存可用库存量与安全库存，判断是否触发安全库存预警
  related_concepts:
  - RawMaterialInventory
  - RawMaterial
  params:
    rawMaterialInventory:
      type: object
      display_name: 原材料库存
      properties:
        rawMaterialId:
          type: string
          display_name: 原材料编号
          example: RM-001
          required: true
        availableStockQuantity:
          type: integer
          display_name: 可用库存
          example: 150
          required: true
      required: true
    rawMaterial:
      type: object
      display_name: 原材料
      properties:
        rawMaterialId:
          type: string
          display_name: 原材料编号
          example: RM-001
          required: true
        safetyStock:
          type: integer
          display_name: 安全库存
          example: 100
          required: true
      required: true
  response:
    result:
      type: object
      properties:
        rawMaterialId:
          type: string
          display_name: 原材料编号
          example: RM-001
        isWarning:
          type: boolean
          display_name: 是否触发安全库存预警
          example: true
        availableStockQuantity:
          type: integer
          display_name: 当前可用库存
          example: 80
        safetyStock:
          type: integer
          display_name: 安全库存阈值
          example: 100
  code_file: functions/checkSafetyStock.py
- name: checkArrivalOverdue
  display_name: 检查采购到位超期
  description: 判断指定采购记录的到位时间是否已超过当前日期，用于触发超期预警
  related_concepts:
  - PurchaseRecord
  params:
    purchaseRecord:
      type: object
      display_name: 采购记录
      properties:
        purchaseRecordId:
          type: string
          display_name: 采购单号
          example: PO-20231027-001
          required: true
        arriveTime:
          type: string
          display_name: 到位时间
          example: '2023-11-10'
          required: true
      required: true
    currentDate:
      type: string
      display_name: 当前日期
      example: '2023-11-11'
      required: true
  response:
    result:
      type: object
      properties:
        purchaseRecordId:
          type: string
          display_name: 采购单号
          example: PO-20231027-001
        isOverdue:
          type: boolean
          display_name: 是否已超期
          example: true
        arriveTime:
          type: string
          display_name: 到位时间
          example: '2023-11-10'
  code_file: functions/checkArrivalOverdue.py
- name: checkOrderExists
  display_name: 检查订单存在性
  description: 校验采购记录关联的订单编号是否存在于客户订单表中，用于判断订单是否有效
  related_concepts:
  - PurchaseRecord
  - CustomerOrder
  params:
    purchaseRecord:
      type: object
      display_name: 采购记录
      properties:
        purchaseRecordId:
          type: string
          display_name: 采购单号
          example: PO-20231027-001
          required: true
        orderId:
          type: string
          display_name: 关联订单编号（可为空）
          example: SO-20231001-001
          required: true
      required: true
    customerOrderSet:
      type: array
      display_name: 客户订单集
      items:
        type: object
        properties:
          orderId:
            type: string
            display_name: 订单编号
            example: SO-20231001-001
            required: true
      required: true
  response:
    result:
      type: object
      properties:
        purchaseRecordId:
          type: string
          display_name: 采购单号
          example: PO-20231027-001
        orderId:
          type: string
          display_name: 关联订单编号
          example: SO-20231001-001
        orderExists:
          type: boolean
          display_name: 订单是否存在
          example: true
  code_file: functions/checkOrderExists.py
- name: inferPurchasePurpose
  display_name: 推断采购目的
  description: 根据采购记录关联订单编号是否为空，推断该采购是补充库存还是订单驱动
  related_concepts:
