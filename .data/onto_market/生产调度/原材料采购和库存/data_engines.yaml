- name: QueryInventory
  display_name: ''
  behavior_name: QueryInventory
  target:
    data_source_name: aps
    api_name: 查询原材料库存
    url: ''
    method: ''
    params:
      rawMaterialId:
        type: string
        display_name: 原材料ID
        required: false
        example: RM-001
      rawMaterialName:
        type: string
        display_name: 原材料名称，模糊匹配
        required: false
        example: 高强度钢板
    response:
      code:
        type: number
        example: 0
      result:
        type: array
        items:
          type: object
          properties:
            rawMaterialId:
              type: string
              display_name: 原材料ID
              example: RM-001
            rawMaterialName:
              type: string
              display_name: 原材料名称
              example: 高强度钢板
            unit:
              type: string
              display_name: 单位
              example: 吨
            pendingReceiptQuantity:
              type: number
              display_name: 待入库量
              example: 0
            cumulativeStockQuantity:
              type: number
              display_name: 累计库存量
              example: 2400
            availableQuantity:
              type: number
              display_name: 可用库存
              example: 1800
            consumedQuantity:
              type: number
              display_name: 已消耗量
              example: 600
            createdAt:
              type: string
              display_name: 创建时间
              example: '2026-07-15T22:33:33'
            updatedAt:
              type: string
              display_name: 更新时间
              example: '2026-07-15T22:33:33'
    server_url: http://optonto-business-mcp:8004/mcp
    tool_name: query_inventories
    output_fields: []
    headers: {}
  input_mapping:
    rawMaterialId: rawMaterialId
    rawMaterialName: rawMaterialName
  output_mapping:
    code: code
    data: result
    data[*].inventoryId: ''
    data[*].rawMaterialId: result[*].rawMaterialId
    data[*].rawMaterialName: result[*].rawMaterialName
    data[*].materialType: ''
    data[*].pendingReceiptQuantity: result[*].pendingReceiptQuantity
    data[*].cumulativeStockQuantity: result[*].cumulativeStockQuantity
    data[*].availableStock: result[*].availableQuantity
    data[*].unit: result[*].unit
