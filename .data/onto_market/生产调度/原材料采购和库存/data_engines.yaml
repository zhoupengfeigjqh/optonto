- name: QueryInventory
  display_name: ''
  behavior_name: QueryInventory
  engine_type: API
  target:
    data_source_name: aps
    api_name: 查询原材料库存
    url: http://optonto-business-backend:8080/api/inventories
    method: GET
    params:
      rawMaterialId:
        type: string
        display_name: 原材料ID
        required: false
        example: RM-001
      rawMaterialName:
        type: string
        display_name: 原材料名称，模糊匹配
        required: false
        example: 高强度钢板
    response:
      code:
        type: number
        example: 0
      data:
        type: array
        items:
          type: object
          properties:
            rawMaterialId:
              type: string
              display_name: 原材料ID
              example: RM-001
            rawMaterialName:
              type: string
              display_name: 原材料名称
              example: 高强度钢板
            unit:
              type: string
              display_name: 单位
              example: 吨
            pendingReceiptQuantity:
              type: number
              display_name: 待入库量
              example: 0
            cumulativeStockQuantity:
              type: number
              display_name: 累计库存量
              example: 2400
            availableQuantity:
              type: number
              display_name: 可用库存
              example: 1800
            consumedQuantity:
              type: number
              display_name: 已消耗量
              example: 600
            createdAt:
              type: string
              display_name: 创建时间
              example: '2026-07-15T22:33:33'
            updatedAt:
              type: string
              display_name: 更新时间
              example: '2026-07-15T22:33:33'
  input_mapping:
    rawMaterialId: rawMaterialId
    rawMaterialName: rawMaterialName
  output_mapping:
    code: code
    data: data
    data[*].inventoryId: ''
    data[*].rawMaterialId: data[*].rawMaterialId
    data[*].rawMaterialName: data[*].rawMaterialName
    data[*].materialType: ''
    data[*].pendingReceiptQuantity: data[*].pendingReceiptQuantity
    data[*].cumulativeStockQuantity: data[*].cumulativeStockQuantity
    data[*].availableStock: data[*].availableQuantity
    data[*].unit: data[*].unit
  sql: ''
