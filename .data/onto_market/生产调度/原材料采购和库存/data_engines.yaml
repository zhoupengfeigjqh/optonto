data_engines:
- name: CreatePurchaseRecord
  display_name: ''
  behavior_name: CreatePurchaseRecord
  target:
    data_source_name: aps
    api_name: 创建采购单
    url: ''
    method: ''
    params:
      rawMaterialId:
        type: string
        display_name: 原材料ID
        required: true
        example: RM-001
      rawMaterialName:
        type: string
        display_name: 原材料名称
        required: true
        example: 高强度钢板
      unit:
        type: string
        display_name: 单位 (吨/千件/桶/千米)
        required: true
        example: 吨
      supplierName:
        type: string
        display_name: 供应商名称
        required: true
        example: 宝钢钢铁集团
      arrivalTime:
        type: string
        display_name: 到货日期 (yyyy-MM-dd)
        required: true
        example: '2026-08-01'
      arrivalQuantity:
        type: number
        display_name: 到货数量
        required: true
        example: 100
      relatedOrderId:
        type: string
        display_name: 关联客户订单ID
        required: false
        example: SO-20231001-001
      relatedOrderName:
        type: string
        display_name: 关联客户订单名称
        required: false
        example: 2023年10月-A客户-建筑钢结构
    response:
      code:
        type: number
        example: 0
      result:
        type: object
        properties:
          purchaseOrderId:
            type: string
            display_name: 采购单号
            example: PO-20260716-026
          rawMaterialId:
            type: string
            display_name: 原材料ID
            example: RM-001
          rawMaterialName:
            type: string
            display_name: 原材料名称
            example: 高强度钢板
          unit:
            type: string
            display_name: 单位
            example: 吨
          purchaseTime:
            type: string
            display_name: 采购时间
            example: '2026-07-16'
          arrivalTime:
            type: string
            display_name: 到货日期
            example: '2026-08-01'
          arrivalQuantity:
            type: number
            display_name: 到货数量
            example: 100
          supplierName:
            type: string
            display_name: 供应商名称
            example: 宝钢钢铁集团
          relatedOrderId:
            type: string
            display_name: 关联客户订单ID
            example: SO-20231001-001
          relatedOrderName:
            type: string
            display_name: 关联客户订单名称
            example: 2023年10月-A客户-建筑钢结构
          status:
            type: string
            display_name: 状态
            example: 待入库
    server_url: http://optonto-business-mcp:8004/mcp
    tool_name: create_purchase_record
    output_fields: []
    headers: {}
  input_mapping:
    rawMaterialId: rawMaterialId
    rawMaterialName: rawMaterialName
    arrivalQuantity: arrivalQuantity
    supplierName: supplierName
    arrivalTime: arrivalTime
    relatedOrderId: relatedOrderId
    relatedOrderName: relatedOrderName
    unit: unit
  output_mapping:
    code: code
    data: result
    data.purchaseRecordId: result.purchaseOrderId
    data.rawMaterialId: result.rawMaterialId
    data.rawMaterialName: result.rawMaterialName
    data.purchaseTime: result.purchaseTime
    data.arrivalTime: result.arrivalTime
    data.arrivalQuantity: result.arrivalQuantity
    data.unit: result.unit
    data.supplierName: result.supplierName
    data.relatedOrderId: result.relatedOrderId
    data.relatedOrderName: result.relatedOrderName
    data.leadTime: ''
    data.status: result.status
