    example: SO-20231025-001
    constraint: 唯一
  - name: customerOrderName
    type: string
    display_name: 订单名称
    example: 客户A-项目X订单
    constraint: ''
  - name: batchNumber
    type: string
    display_name: 订单批次号
    example: BATCH-001
    constraint: ''
  - name: bufferPeriod
    type: number
    display_name: 订单缓冲周期
    example: '7'
    constraint: ≥ 0
  - name: orderType
    type: enum
    display_name: 订单类型
    example: 销售
    constraint: 销售/询单
  - name: status
    type: enum
    display_name: 订单状态
    example: 有效
    constraint: 有效/无效
  display_name: 客户订单
- name: DeliveryCapability
  description: 供应商的交货能力，包括交货周期、最低交货数量等
  attributes:
  - name: rawMaterialId
    type: string
    display_name: 原材料编号
    example: ''
    constraint: ''
  - name: rawMaterialName
    type: string
    display_name: 原材料名称
    example: ''
    constraint: ''
  - name: supplierName
    type: string
    display_name: 供应商名称
    example: ''
    constraint: ''
  - name: supplierId
    type: string
    display_name: 供应商编号
    example: ''
    constraint: ''
  - name: leadTime
    type: number
    display_name: 交货周期
    example: ''
    constraint: ''
  - name: minCount
    type: number
    display_name: 最小交货数
    example: ''
    constraint: ''
  display_name: 交货能力
relations:
- name: hasRawInventory
  source: RawMaterial
  target: RawMaterialInventory
  cardinality: '1:1'
  description: 每个原材料有且仅有一条对应的最新库存快照。
  display_name: 拥有库存
- name: recordsRawMaterial
  source: PurchaseRecord
  target: RawMaterial
  cardinality: N:1
  description: 多个采购记录可以指向同一种原材料，但一个采购记录只采购一种原材料。
  display_name: 记录原材料
- name: orderedFromSupplier
  source: PurchaseRecord
  target: Supplier
  cardinality: N:1
  description: 多个采购记录可以从同一个供应商采购，但一个采购记录只对应一个供应商。
  display_name: 从...采购
- name: suppliesRawMaterial
  source: Supplier
  target: RawMaterial
  cardinality: N:M
  description: 一个供应商可以供应多种原材料，一种原材料也可以由多个供应商供应。
  display_name: 供应原材料
- name: containsPurchaseRecord
  source: CustomerOrder
  target: PurchaseRecord
  cardinality: 1:N
  description: 一个客户订单可以包含多个采购记录，但一个采购记录最多只能关联一个客户订单。
  display_name: 包含采购记录
- name: hasCapability
  source: Supplier
  target: DeliveryCapability
  cardinality: 1:N
  description: 一个供应商可以包含多个原材料的供应能力，但一个交货能力只对应一个供应商
  display_name: 拥有供应能力
functions:
- name: sumRawNotArrivalQty
  display_name: 原材料未到位数
  description: 根据传入的数据包指定的原材料，过滤掉到位时间小于当前时间的部分，对剩余部分的到位数arrivalQuantity求和。
  related_attributes:
  - PurchaseRecord.arrivalQuantity
  - PurchaseRecord.arrivalTime
  - PurchaseRecord.rawMaterialName
  params:
    filterRawMaterialName:
      type: string
      display_name: 原材料名称
      example: 高强度钢板
      required: true
    currentDate:
      type: string
      display_name: 日期
      example: '2026-01-01'
      required: true
    purchaseRecordSet:
      type: array
      display_name: 采购记录集
      items:
        type: object
        properties:
          arrivalTime:
            type: string
            display_name: 到位时间
            example: '2026-09-01'
            required: true
          rawMaterialName:
            type: string
            display_name: 原材料名称
            example: 高强度钢板
            required: true
          arrivalQuantity:
            type: number
            display_name: 计划的到位数量
            example: 100
            required: true
      required: true
  response:
    result:
      type: object
      properties:
        rawMaterialName:
          type: string
          display_name: 原材料名称
          example: 高强度钢板
        sumNotArrivalQty:
          type: number
          display_name: 未到位总量
          example: 100
  code_file: functions/sumRawNotArrivalQty.py
