rules:
- name: V01_UnitConsistency_Purchase
  description: 创建采购单时，提供的 rawMaterialId 必须与RawMaterial 概念中的rawMaterialId一致，并且unit页必须一致。
  related_behaviors:
  - CreatePurchaseRecord
  related_functions: []
  display_name: 采购-原料存在且单位一致
  rule_type: 验证规则
  position: 前置
  rule_detail:
    if:
      logic: and
      conditions:
      - left:
          type: concept
          concept: PurchaseRecord
          attribute: rawMaterialId
        operator: in
        right:
          type: concept
          concept: RawMaterial
          attribute: rawMaterialId
      - left:
          type: concept
          concept: PurchaseRecord
          attribute: unit
        operator: eq
        right:
          type: concept
          concept: RawMaterial
          attribute: unit
  data_supplements:
  - QueryRawMaterials
- name: V03_ArrivalTimeValidity
  description: 创建采购单时，输入的 arrivalTime 必须晚于 purchaseTime。
  related_behaviors:
  - CreatePurchaseRecord
  related_functions: []
  display_name: 采购-到位时间合理性
  rule_type: 验证规则
  position: 前置
  rule_detail:
    if:
      logic: and
      conditions:
      - left:
          type: concept
          concept: PurchaseRecord
          attribute: arrivalTime
        operator: gt
        right:
          type: concept
          concept: PurchaseRecord
          attribute: purchaseTime
  data_supplements: []
- name: V05_SupplierExistence
  description: 创建采购单时，提供的 supplierName 必须与 Supplier 概念中suplierName的一致。
  related_behaviors:
  - CreatePurchaseRecord
  related_functions: []
  display_name: 采购-供应商名称一致
  rule_type: 验证规则
  position: 前置
  rule_detail:
    if:
      logic: and
      conditions:
      - left:
          type: concept
          concept: PurchaseRecord
          attribute: supplierName
        operator: in
        right:
          type: concept
          concept: Supplier
          attribute: supplierName
  data_supplements:
  - QuerySuppliers
- name: I01_SafetyStockAlert
  description: IF 可用库存availableStock < 原材料的safetyStock THEN 推送预警，建议创建采购单或关注库存。
  related_behaviors:
  - QueryInventory
  related_functions: []
  display_name: 安全库存预警
  rule_type: 推理规则
  position: 后置
  rule_detail:
    if:
      logic: and
      conditions:
      - left:
          type: concept
          concept: RawMaterialInventory
          attribute: availableStock
        operator: lt
        right:
          type: concept
          concept: RawMaterial
          attribute: safetyStock
    then: 可用库存低于安全库存，建议创建采购单或关注库存
    else: 库存正常，无需操作
  data_supplements: []
- name: I02_ArrivalOverdueAlert
  description: IF 当前日期 >= 采购单arrivalTime  THEN 提示用户是否启动入库操作。
  related_behaviors:
  - QueryPurchaseRecords
  related_functions:
  - getCurrentDate
  display_name: 采购到位超期预警
  rule_type: 推理规则
  position: 后置
  rule_detail:
    if:
      logic: and
      conditions:
      - left:
          type: function
          function: getCurrentDate
          returnField: date
        operator: ge
        right:
          type: concept
          concept: PurchaseRecord
          attribute: arrivalTime
    then: 采购单已到位，建议启动入库操作
    else: 采购单尚未到位，无需操作
  data_supplements: []
- name: I03_PurchasePurposeInference
  description: IF 采购单relatedOrderId 为空 THEN 该采购目的可视为“补充库存”。
  related_behaviors:
  - CreatePurchaseRecord
  - QueryPurchaseRecords
  related_functions: []
  display_name: 采购目的推理
  rule_type: 推理规则
  position: 后置
  rule_detail:
    if:
      logic: and
      conditions:
      - left:
          type: concept
          concept: PurchaseRecord
          attribute: relatedOrderId
        operator: eq
        right:
          type: value
          value: '""'
    then: 该采购单的采购目的可视为“补充库存”
    else: 该采购单有关联订单，采购目的可能为生产订单备料
  data_supplements: []
- name: I04_RelatedOrderValidation
  description: 创建采购单时，如果客户订单relatedOrderId不为空，则必须存在于客户订单中
  related_behaviors:
  - CreatePurchaseRecord
  related_functions: []
  display_name: 采购-关联订单存在性
  rule_type: 推理规则
  position: 前置
  rule_detail:
    if:
      logic: and
      conditions:
      - left:
          type: concept
          concept: PurchaseRecord
          attribute: relatedOrderId
        operator: ne
        right:
          type: value
          value: '""'
      - left:
          type: concept
          concept: PurchaseRecord
          attribute: relatedOrderId
        operator: not in
        right:
          type: set
          concept: CustomerOrder
          attribute: customerOrderId
    then: 关联订单编号不存在于客户订单中，请中断后续推理，并检查
    else: 关联订单编号存在或未填写，校验通过
  data_supplements: []
events:
- name: PurchaseRecordCreated
  event_type: 动作执行
  trigger_condition: 成功执行 CreatePurchaseRecord 行为后。
  related_concepts: []
  related_behavior: CreatePurchaseRecord
  trigger_behaviors:
  - QueryInventory
  - QueryPurchaseRecords
  display_name: 原材料采购订单创建事件
- name: PurchaseRecordCancelled
  event_type: 动作执行
  trigger_condition: 成功执行 CancelPurchaseRecord 行为后。
  related_concepts: []
  related_behavior: CancelPurchaseRecord
  trigger_behaviors:
  - QueryInventory
  - QueryPurchaseRecords
  display_name: 原材料采购订单取消事件
- name: RawMaterialReceived
  event_type: 动作执行
  trigger_condition: 成功执行 ReceiveRawMaterial 行为后。
  related_concepts: []
  related_behavior: ReceiveRawMaterial
  trigger_behaviors:
  - QueryInventory
  display_name: 原材料入库事件
processes:
- name: ProcureAndReceiveRawMaterial
  display_name: 原材料采购到入库
  goal: 完成从库存查询到采购、入库的完整流程。
  description: 用户或系统查询原材料库存，判断是否需要采购；根据库存情况或客户订单需求，创建原材料采购单；定期或按需查询采购记录，跟踪已创建的采购单状态；确认原材料到货，执行入库操作，更新库存；入库完成后，再次查询库存，确认库存状态已更新。
  steps:
  - current_action: QueryInventory
    previous_action: ''
    description: 用户或系统查询原材料库存，判断是否需要采购。
    connection_type: 串行
  - current_action: CreatePurchaseRecord
    previous_action: QueryInventory
    description: 根据库存情况或客户订单需求，创建原材料采购单。
    connection_type: 串行
  - current_action: QueryPurchaseRecords
    previous_action: CreatePurchaseRecord
    description: 定期或主动按需查询采购记录，跟踪已创建的采购单状态。
    connection_type: 串行
  - current_action: ReceiveRawMaterial
    previous_action: QueryPurchaseRecords
    description: 确认原材料到货，执行入库操作，更新库存。
    connection_type: 串行
  - current_action: QueryInventory
    previous_action: ReceiveRawMaterial
    description: 入库完成后，再次查询库存，确认库存状态已更新。
    connection_type: 串行
securities:
- action_name: CreatePurchaseRecord
  audit_node: 前置
  audit_content: 审核采购的必要性：请确认是否确实需要补货，关联的客户订单是否真实有效，采购数量和到位时间是否合理。
- action_name: CancelPurchaseRecord
  audit_node: 前置
  audit_content: 审核取消的原因：确认取消采购单是否合理，是否已与供应商沟通，是否存在违约风险。
- action_name: ReceiveRawMaterial
  audit_node: 前置
  audit_content: 审核入库的准确性：请确认到货的原材料、数量、供应商是否与采购单一致，质检是否已通过（如适用）。
