metadata:
  name: 原材料采购与库存管理本体
  source_file: 原材料采购需求分析.md
  source_thread: 原材料采购与库存管理
  created_at: '2026-07-15 16:05:02'
  scenario_name: 生产调度
  scenario_id: 1
  ontology_name: 原材料采购和库存
  ontology_id: 1
concepts:
- name: RawMaterial
  description: 生产过程中消耗的外部输入物料，是采购和库存管理的核心对象。
  attributes:
  - name: rawMaterialId
    type: string
    display_name: 原材料编号
    example: RM-001
    constraint:
      unique: false
      required: true
      enum: []
      pattern: ''
  - name: rawMaterialName
    type: string
    display_name: 原材料名称
    example: 高强度钢板
    constraint:
      unique: false
      required: true
      enum: []
      pattern: ''
  - name: unit
    type: string
    display_name: 单位
    example: 吨
    constraint:
      unique: false
      required: true
      enum: []
      pattern: ''
  - name: safetyStock
    type: number
    display_name: 安全库存
    example: '100'
  display_name: 原材料
- name: Supplier
  description: 原材料的供应方，可以供应一种或多种原材料。
  attributes:
  - name: supplierId
    type: string
    display_name: 供应商编号
    example: SUP-001
  - name: supplierName
    type: string
    display_name: 供应商名称
    example: XX钢铁集团
  - name: address
    type: string
    display_name: 地址
    example: XX省XX市XX路XX号
  - name: contactPerson
    type: string
    display_name: 联系人
    example: 张三
  - name: contactPhone
    type: string
    display_name: 联系电话
    example: '13800138000'
  display_name: 供应商
- name: PurchaseRecord
  description: 一次具体的原材料采购行为，关联了采购的原材料、供应商以及驱动采购的客户订单。
  attributes:
  - name: purchaseRecordId
    type: string
    display_name: 采购单号
    example: PO-20231027-001
  - name: rawMaterialId
    type: string
    display_name: 原材料编号
    example: RM-001
  - name: rawMaterialName
    type: string
    display_name: 原材料名称
    example: 高强度钢板
  - name: purchaseTime
    type: string
    display_name: 采购时间
    example: '2023-10-27'
  - name: arrivalTime
    type: string
    display_name: 到位时间
    example: '2023-11-10'
  - name: arrivalQuantity
    type: number
    display_name: 到位数量
    example: '50'
  - name: unit
    type: string
    display_name: 单位
    example: 吨
  - name: leadTime
    type: number
    display_name: 等待周期
    example: '14'
  - name: supplierName
    type: string
    display_name: 供应商名称
    example: XX钢铁集团
  - name: relatedOrderId
    type: string
    display_name: 关联订单编号
    example: SO-20231025-001
  - name: relatedOrderName
    type: string
    display_name: 关联订单名称
    example: 客户A-项目X订单
  display_name: 原材料采购记录
- name: RawMaterialInventory
  description: 特定原材料在当前时刻的库存状态快照，包括待入库、可用和累计库存量。
  attributes:
  - name: inventoryId
    type: string
    display_name: 库存编号
    example: INV-RM-001
  - name: rawMaterialId
    type: string
    display_name: 原材料编号
    example: RM-001
  - name: rawMaterialName
    type: string
    display_name: 原材料名称
    example: 高强度钢板
  - name: materialType
    type: string
    display_name: 材料类型
    example: 原材料
  - name: pendingReceiptQuantity
    type: number
    display_name: 待入库量
    example: '50'
  - name: cumulativeStockQuantity
    type: number
    display_name: 累计库存量
    example: '200'
  - name: availableStock
    type: number
    display_name: 可用库存
    example: '150'
  - name: unit
    type: string
    display_name: 单位
    example: 吨
  display_name: 原材料库存
- name: CustomerOrder
  description: 客户下达的销售订单或询单，是驱动原材料采购的源头需求。
  attributes:
  - name: customerOrderId
    type: string
    display_name: 订单编号
    example: SO-20231025-001
  - name: customerOrderName
    type: string
    display_name: 订单名称
    example: 客户A-项目X订单
  - name: batchNumber
    type: string
    display_name: 订单批次号
    example: BATCH-001
  - name: bufferPeriod
    type: number
    display_name: 订单缓冲周期
    example: '7'
  - name: orderType
    type: enum
    display_name: 订单类型
    example: 销售
  - name: status
    type: enum
    display_name: 订单状态
    example: 有效
  display_name: 客户订单
- name: DeliveryCapability
  description: 供应商的交货能力，包括交货周期、最低交货数量等
  attributes:
  - name: rawMaterialId
    type: string
    display_name: 原材料编号
    example: ''
  - name: rawMaterialName
    type: string
    display_name: 原材料名称
    example: ''
  - name: supplierName
    type: string
    display_name: 供应商名称
    example: ''
  - name: supplierId
    type: string
    display_name: 供应商编号
    example: ''
  - name: leadTime
    type: number
    display_name: 交货周期
    example: ''
  - name: minCount
    type: number
    display_name: 最小交货数
    example: ''
  display_name: 交货能力
relations:
- name: hasRawInventory
  source: RawMaterial
  target: RawMaterialInventory
  cardinality: '1:1'
  description: 每个原材料有且仅有一条对应的最新库存快照。
  display_name: 拥有库存
- name: recordsRawMaterial
  source: PurchaseRecord
  target: RawMaterial
  cardinality: N:1
  description: 多个采购记录可以指向同一种原材料，但一个采购记录只采购一种原材料。
  display_name: 记录原材料
- name: orderedFromSupplier
  source: PurchaseRecord
  target: Supplier
  cardinality: N:1
  description: 多个采购记录可以从同一个供应商采购，但一个采购记录只对应一个供应商。
  display_name: 从...采购
- name: suppliesRawMaterial
  source: Supplier
  target: RawMaterial
  cardinality: N:M
  description: 一个供应商可以供应多种原材料，一种原材料也可以由多个供应商供应。
  display_name: 供应原材料
- name: containsPurchaseRecord
  source: CustomerOrder
  target: PurchaseRecord
  cardinality: 1:N
  description: 一个客户订单可以包含多个采购记录，但一个采购记录最多只能关联一个客户订单。
  display_name: 包含采购记录
- name: hasCapability
  source: Supplier
  target: DeliveryCapability
  cardinality: 1:N
  description: 一个供应商可以包含多个原材料的供应能力，但一个交货能力只对应一个供应商
  display_name: 拥有供应能力
functions:
- name: sumRawNotArrivalQty
  display_name: 原材料未到位数
  description: 根据传入的数据包指定的原材料，过滤掉到位时间小于当前时间的部分，对剩余部分的到位数arrivalQuantity求和。
  related_concepts:
  - PurchaseRecord
  params:
    filterRawMaterialName:
      type: string
      display_name: 原材料名称
      example: 高强度钢板
      required: true
    currentDate:
      type: string
      display_name: 日期
      example: '2026-01-01'
      required: true
    purchaseRecordSet:
      type: array
      display_name: 采购记录集
      items:
        type: object
        properties:
          arrivalTime:
            type: string
            display_name: 到位时间
            example: '2026-09-01'
            required: true
          rawMaterialName:
            type: string
            display_name: 原材料名称
            example: 高强度钢板
            required: true
          arrivalQuantity:
            type: number
            display_name: 计划的到位数量
            example: 100
            required: true
      required: true
  response:
    result:
      type: object
      properties:
        rawMaterialName:
          type: string
          display_name: 原材料名称
          example: 高强度钢板
        sumNotArrivalQty:
          type: number
          display_name: 未到位总量
          example: 100
  code_file: functions/sumRawNotArrivalQty.py
