rules:
- name: V01_UnitConsistency_Purchase
  description: 创建采购单时，提供的原材料ID（rawMaterialId）必须存在，且单位也必须与原材料的定义一致。
  related_behaviors:
  - CreatePurchaseRecord
  related_functions: []
  display_name: 采购-原料存在且单位一致
  rule_type: 验证规则
  position: 前置
  rule_detail:
    if:
      logic: and
      conditions:
      - left:
          type: concept
          concept: PurchaseRecord
          attribute: rawMaterialId
        operator: eq
        right:
          type: concept
          concept: RawMaterial
          attribute: rawMaterialId
      - left:
          type: concept
          concept: PurchaseRecord
          attribute: unit
        operator: eq
        right:
          type: concept
          concept: RawMaterial
          attribute: unit
  data_supplements:
  - QueryRawMaterials
- name: V03_ArrivalTimeValidity
  description: 创建采购单时，输入的到位时间（arrivalTime）必须晚于采购时间（purchaseTime）。
  related_behaviors:
  - CreatePurchaseRecord
  related_functions: []
  display_name: 采购-到位时间合理性
  rule_type: 验证规则
  position: 前置
  rule_detail:
    if:
      logic: and
      conditions:
      - left:
          type: concept
          concept: PurchaseRecord
          attribute: arrivalTime
        operator: gt
        right:
          type: concept
          concept: PurchaseRecord
          attribute: purchaseTime
  data_supplements: []
- name: V05_SupplierExistence
  description: 创建采购单时，提供的供应商名称（supplierName）必须存在，不能随便杜撰。
  related_behaviors:
  - CreatePurchaseRecord
  related_functions: []
  display_name: 采购-供应商名称一致
  rule_type: 验证规则
  position: 前置
  rule_detail:
    if:
      logic: and
      conditions:
      - left:
          type: concept
          concept: PurchaseRecord
          attribute: supplierName
        operator: in
        right:
          type: concept
          concept: Supplier
          attribute: supplierName
  data_supplements:
  - QuerySuppliers
- name: I01_SafetyStockAlert
  description: IF 可用库存availableStock < 原材料的safetyStock THEN 推送预警，建议创建采购单或关注库存。
  related_behaviors:
  - QueryInventory
  related_functions: []
  display_name: 安全库存预警
  rule_type: 推理规则
  position: 后置
  rule_detail:
    if:
      logic: and
      conditions:
      - left:
          type: concept
          concept: RawMaterialInventory
          attribute: availableStock
        operator: lt
        right:
          type: concept
          concept: RawMaterial
          attribute: safetyStock
    then: 可用库存低于安全库存，建议创建采购单或关注库存
    else: 库存正常，无需操作
  data_supplements: []
- name: I02_ArrivalOverdueAlert
  description: IF 当前日期 >= 采购单arrivalTime  THEN 提示用户是否启动入库操作。
  related_behaviors:
  - QueryPurchaseRecords
  related_functions:
  - getCurrentDate
  display_name: 采购到位超期预警
  rule_type: 推理规则
  position: 后置
  rule_detail:
    if:
      logic: and
      conditions:
      - left:
          type: function
          function: getCurrentDate
          returnField: date
        operator: ge
        right:
          type: concept
          concept: PurchaseRecord
          attribute: arrivalTime
    then: 采购单已到位，请考虑是否进行入库操作
    else: 采购单尚未到位，无需操作
  data_supplements: []
- name: I03_PurchasePurposeInference
  description: IF 采购单的关联客户订单ID（relatedOrderId）为空 THEN 该采购目的可视为“补充库存”。
  related_behaviors:
  - CreatePurchaseRecord
  related_functions: []
  display_name: 采购目的推理
  rule_type: 推理规则
  position: 后置
  rule_detail:
    if:
      logic: and
      conditions:
      - left:
          type: concept
          concept: PurchaseRecord
          attribute: relatedOrderId
        operator: eq
        right:
          type: value
          value: '""'
    then: 该采购单未关联具体的客户订单，因此可视为“补充库存”
    else: 该采购单有关联订单，采购目的视为生产订单备料
  data_supplements: []
- name: I04_RelatedOrderValidation
  description: 创建采购单时，如果客户订单relatedOrderId不为空，则必须存在于客户订单中
  related_behaviors:
  - CreatePurchaseRecord
  related_functions: []
  display_name: 采购-关联订单存在性
  rule_type: 推理规则
  position: 前置
  rule_detail:
    if:
      logic: and
      conditions:
      - left:
          type: concept
          concept: PurchaseRecord
          attribute: relatedOrderId
        operator: ne
        right:
          type: value
          value: '""'
      - left:
          type: concept
          concept: PurchaseRecord
          attribute: relatedOrderId
        operator: not in
        right:
          type: set
          concept: CustomerOrder
          attribute: customerOrderId
    then: 由于关联订单编号不存在于客户订单中，因此该订单创建无效，请中止
    else: 关联订单编号存在或未填写，校验通过
  data_supplements: []
processes:
- name: ProcureAndReceiveRawMaterial
  display_name: 原材料采购到入库
  goal: 完成从库存查询到采购、入库的完整流程。
  description: 用户或系统查询原材料库存，判断是否需要采购；根据库存情况或客户订单需求，创建原材料采购单；定期或按需查询采购记录，跟踪已创建的采购单状态；确认原材料到货，执行入库操作，更新库存；入库完成后，再次查询库存，确认库存状态已更新。
  steps:
  - current_action: QueryInventory
    previous_action: ''
    description: 用户或系统查询原材料库存，判断是否需要采购。
    connection_type: 串行
  - current_action: CreatePurchaseRecord
    previous_action: QueryInventory
    description: 根据库存情况或客户订单需求，创建原材料采购单。
    connection_type: 串行
  - current_action: QueryPurchaseRecords
    previous_action: CreatePurchaseRecord
    description: 定期或主动按需查询采购记录，跟踪已创建的采购单状态。
    connection_type: 串行
  - current_action: ReceiveRawMaterial
    previous_action: QueryPurchaseRecords
    description: 确认原材料到货，执行入库操作，更新库存。
    connection_type: 串行
securities:
- action_name: CreatePurchaseRecord
  audit_node: 前置
  audit_content: 确认采购信息正确性：请再次确认该采购信息，例如关联的客户订单是否真实有效，采购数量和到位时间是否合理。
- action_name: CancelPurchaseRecord
  audit_node: 前置
  audit_content: 确认采购取消的原因：确认取消采购单是否合理，是否存在违约风险。
- action_name: ReceiveRawMaterial
  audit_node: 前置
  audit_content: 确认入库的准确性：请确认到货的原材料、数量、供应商是否与采购单一致。
