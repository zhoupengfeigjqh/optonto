metadata:
  name: 原材料采购与库存管理本体
  source_file: 原材料采购需求分析.md
  source_thread: 原材料采购与库存管理
  created_at: '2026-07-15 16:05:01'
  scenario_name: 生产调度
  scenario_id: 1
  ontology_name: 原材料采购和库存
  ontology_id: 1
concepts:
- name: RawMaterial
  description: 生产过程中消耗的外部输入物料，是采购和库存管理的核心对象。
  attributes:
  - name: rawMaterialId
    type: string
    display_name: 原材料编号
    example: RM-001
    constraint: 唯一
  - name: rawMaterialName
    type: string
    display_name: 原材料名称
    example: 高强度钢板
    constraint: ''
  - name: unit
    type: string
    display_name: 单位
    example: 吨
    constraint: ''
  - name: safetyStock
    type: number
    display_name: 安全库存
    example: '100'
    constraint: ≥ 0
  display_name: 原材料
- name: Supplier
  description: 原材料的供应方，可以供应一种或多种原材料。
  attributes:
  - name: supplierId
    type: string
    display_name: 供应商编号
    example: SUP-001
    constraint: 唯一
  - name: supplierName
    type: string
    display_name: 供应商名称
    example: XX钢铁集团
    constraint: ''
  - name: address
    type: string
    display_name: 地址
    example: XX省XX市XX路XX号
    constraint: ''
  - name: contactPerson
    type: string
    display_name: 联系人
    example: 张三
    constraint: ''
  - name: contactPhone
    type: string
    display_name: 联系电话
    example: '13800138000'
    constraint: ''
  display_name: 供应商
- name: PurchaseRecord
  description: 一次具体的原材料采购行为，关联了采购的原材料、供应商以及驱动采购的客户订单。
  attributes:
  - name: purchaseRecordId
    type: string
    display_name: 采购单号
    example: PO-20231027-001
    constraint: 唯一
  - name: rawMaterialId
    type: string
    display_name: 原材料编号
    example: RM-001
    constraint: ''
  - name: rawMaterialName
    type: string
    display_name: 原材料名称
    example: 高强度钢板
    constraint: ''
  - name: purchaseTime
    type: string
    display_name: 采购时间
    example: '2023-10-27'
    constraint: yyyy-mm-dd
  - name: arrivalTime
    type: string
    display_name: 到位时间
    example: '2023-11-10'
    constraint: yyyy-mm-dd
  - name: arrivalQuantity
    type: number
    display_name: 到位数量
    example: '50'
    constraint: ≥ 0
  - name: unit
    type: string
    display_name: 单位
    example: 吨
    constraint: ''
  - name: leadTime
    type: number
    display_name: 等待周期
    example: '14'
    constraint: ≥ 0
  - name: supplierName
    type: string
    display_name: 供应商名称
    example: XX钢铁集团
    constraint: ''
  - name: relatedOrderId
    type: string
    display_name: 关联订单编号
    example: SO-20231025-001
    constraint: ''
  - name: relatedOrderName
    type: string
    display_name: 关联订单名称
    example: 客户A-项目X订单
    constraint: ''
  display_name: 原材料采购记录
- name: RawMaterialInventory
  description: 特定原材料在当前时刻的库存状态快照，包括待入库、可用和累计库存量。
  attributes:
  - name: inventoryId
    type: string
    display_name: 库存编号
    example: INV-RM-001
    constraint: 唯一
  - name: rawMaterialId
    type: string
    display_name: 原材料编号
    example: RM-001
    constraint: ''
  - name: rawMaterialName
    type: string
    display_name: 原材料名称
    example: 高强度钢板
    constraint: ''
  - name: materialType
    type: enum
    display_name: 材料类型
    example: 原材料
    constraint: ''
  - name: pendingReceiptQuantity
    type: number
    display_name: 待入库量
    example: '50'
    constraint: ≥ 0
  - name: cumulativeStockQuantity
    type: number
    display_name: 累计库存量
    example: '200'
    constraint: ≥ 0
  - name: availableStock
    type: number
    display_name: 可用库存
    example: '150'
