metadata:
  source_file: ''
  source_thread: ''
  created_at: ''
  scenario_name: ''
  scenario_id: 0
  ontology_name: ''
  ontology_id: 0
concepts:
- name: ConceptName
  description: 概念描述
  attributes:
  - name: attrName
    type: string
    display_name: 属性展示名称
    description: 属性详细描述
    example: 示例值
    constraint:
      unique: true
      required: true
      pattern: '^[A-Za-z0-9_-]+$'
  - name: enumAttrName
    type: string
    display_name: 枚举属性示例
    description: 取值受限于固定集合时用 constraint.enum 表达（status 属性必须如此）
    example: 有效
    constraint:
      enum:
      - 有效
      - 无效
      required: true
  - name: numericAttrName
    type: number
    display_name: 数值属性示例
    description: number/integer 类型属性可在 constraint 中填写取值范围（min/max 可只填其一）
    example: 50
    constraint:
      min: 0
      max: 100
  display_name: 概念展示名称
  instance_label: attrName（可选：实例展示时作为节点标签的属性英文名，须是本概念已定义的属性；无则留空）
  terms:
  - 该概念的其他表述（同义词/别名/简称，可为空）
relations:
- name: relationName
  source: SourceConcept
  target: TargetConcept
  cardinality: 1:N
  relation_type:
  - functional
  source_attr: attrName
  target_attr: attrName
  description: 关系描述
  display_name: 关系展示名称
functions:
- name: sumRawNotArrivalQty
  display_name: 原材料未到位数
  description: 根据传入的数据包指定的原材料，过滤掉到位时间小于当前时间的部分，对剩余部分的到位数arrivalQuantity求和。
  related_concepts:
  - PurchaseRecord
  params:
    filterRawMaterialName:
      type: string
      display_name: 原材料名称
      example: 高强度钢板
      required: true
    currentDate:
      type: string
      display_name: 日期
      example: '2026-01-01'
      required: true
    purchaseRecordSet:
      type: array
      display_name: 采购记录集
      items:
        type: object
        properties:
          arrivalTime:
            type: string
            display_name: 到位时间
            example: '2026-09-01'
            required: true
          rawMaterialName:
            type: string
            display_name: 原材料名称
            example: 高强度钢板
            required: true
          arrivalQuantity:
            type: number
            display_name: 计划的到位数量
            example: 100
            required: true
      required: true
  response:
    rawMaterialName:
      type: string
      display_name: 原材料名称
      example: 高强度钢板
    sumNotArrivalQty:
      type: number
      display_name: 未到位总量
      example: 100
  code_file: functions/sumRawNotArrivalQty.py
  type: CALCULATION
behaviors:
- name: behaviorName
  description: 行为描述
  op_type: command
  params:
    tradeId:
      type: string
      description: 交易编号
      required: true
      example: TRD001
    status:
      type: string
      description: 状态
      required: true
      example: active
    user:
      type: object
      description: 用户信息
      required: true
      properties:
        id:
          type: string
          description: 用户ID
          required: true
          example: USR001
        name:
          type: string
          description: 用户名称
          required: true
          example: 张三
    tags:
      type: array
      description: 标签列表
      required: false
      items:
        type: string
        example: 加急
    products:
      type: array
      description: 产品列表
      required: true
      items:
        type: object
        properties:
          sku:
            type: string
            description: SKU
            required: true
            example: SKU-001
          quantity:
            type: number
            description: 数量
            required: true
            example: 10
  response:
    code:
      type: number
      display_name: 状态码
      example: 0
    data:
      type: object
      display_name: 返回数据
      properties:
        orderId:
          type: string
          display_name: 订单编号
          example: ORD001
        total:
          type: number
          display_name: 订单总额
          example: 1500.5
  concept: ConceptName
  from_status: 原状态（command 行为填写，取自关联概念 status 属性的枚举；query 行为留空）
  to_status: 新状态（command 行为填写，同上；query 行为留空）
  display_name: 行为展示名称
- name: queryOrderSQL
  description: 根据订单状态查询订单明细
  op_type: query
  params:
    status:
      type: string
      description: 订单状态
      required: true
      example: active
    orderDate:
      type: string
      description: 订单日期
      required: false
      example: '2026-01-01'
  response:
    code:
      type: number
      example: 0
    data:
      type: array
      items:
        type: object
        properties:
          orderId:
            type: string
            example: ORD001
          amount:
            type: number
            example: 1500
  concept: ConceptName
  display_name: SQL查询订单
rules:
- name: ruleName
  description: 规则描述，详细的规则逻辑
  behavior: behaviorName
  related_functions:
  - functionName
  display_name: 规则展示名称
  position: 前置/后置
  data_supplements:
  - queryBehaviorName
processes:
- name: processName
  display_name: 流程展示名称
  goal: 流程目标
  description: 流程描述
  steps:
  - current_action: behaviorName
    previous_action: ''
    description: 步骤描述
    connection_type: 串行
