metadata:
  name: ''
  source_file: ''
  source_thread: ''
  created_at: ''
concepts:
- name: ConceptName
  description: 概念描述
  attributes:
  - name: attrName
    type: string
    required: true
    display_name: 属性展示名称
    description: 属性详细描述
    example: 示例值
    constraint: ''
  - name: numericAttrName
    type: number
    display_name: 数值属性示例
    description: number/integer类型属性可在constraint中填写取值范围（min/max可只填其一，无范围则constraint为''）
    example: 50
    constraint:
      min: 0
      max: 100
  display_name: 概念展示名称
relations:
- name: relationName
  source: SourceConcept
  target: TargetConcept
  cardinality: 1:N
  source_attr: attrName
  target_attr: attrName
  description: 关系描述
  display_name: 关系展示名称
functions:
- name: sumRawNotArrivalQty
  display_name: 原材料未到位数
  description: 根据传入的数据包指定的原材料，过滤掉到位时间小于当前时间的部分，对剩余部分的到位数arrivalQuantity求和。
  related_concepts:
  - PurchaseRecord
  params:
    filterRawMaterialName:
      type: string
      display_name: 原材料名称
      example: 高强度钢板
      required: true
    currentDate:
      type: string
      display_name: 日期
      example: '2026-01-01'
      required: true
    purchaseRecordSet:
      type: array
      display_name: 采购记录集
      items:
        type: object
        properties:
          arrivalTime:
            type: string
            display_name: 到位时间
            example: '2026-09-01'
            required: true
          rawMaterialName:
            type: string
            display_name: 原材料名称
            example: 高强度钢板
            required: true
          arrivalQuantity:
            type: number
            display_name: 计划的到位数量
            example: 100
            required: true
      required: true
  response:
    result:
      type: object
      properties:
        rawMaterialName:
          type: string
          display_name: 原材料名称
          example: 高强度钢板
        sumNotArrivalQty:
          type: number
          display_name: 未到位总量
          example: 100
  code_file: functions/sumRawNotArrivalQty.py
behaviors:
- name: behaviorName
  description: 行为描述
  behavior_type: API
  op_type: command
  params:
    tradeId:
      type: string
      display_name: 交易编号
      required: true
      example: TRD001
    status:
      type: string
      display_name: 状态
      required: true
      example: active
    user:
      type: object
      display_name: 用户信息
      required: true
      properties:
        id:
          type: string
          display_name: 用户ID
          required: true
          example: USR001
        name:
          type: string
          display_name: 用户名称
          required: true
          example: 张三
    tags:
      type: array
      display_name: 标签列表
      required: false
      items:
        type: string
        example: 加急
    products:
      type: array
      display_name: 产品列表
      required: true
      items:
        type: object
        properties:
          sku:
            type: string
            display_name: SKU
            required: true
            example: SKU-001
          quantity:
            type: number
            display_name: 数量
            required: true
            example: 10
  response:
    code:
      type: number
      display_name: 状态码
      example: 0
    data:
      type: object
      display_name: 返回数据
      properties:
        orderId:
          type: string
          display_name: 订单编号
          example: ORD001
        total:
          type: number
          display_name: 订单总额
          example: 1500.5
  related_concepts:
  - ConceptName
  display_name: 行为展示名称
- name: queryOrderSQL
  description: 根据订单状态查询订单明细
  behavior_type: SQL
  op_type: query
  params:
    status:
      type: string
      display_name: 订单状态
      required: true
      example: active
    orderDate:
      type: string
      display_name: 订单日期
      required: false
      example: '2026-01-01'
  response:
    code:
      type: number
      example: 0
    data:
      type: array
      items:
        type: object
        properties:
          orderId:
            type: string
            example: ORD001
          amount:
            type: number
            example: 1500
  related_concepts:
  - ConceptName
  display_name: SQL查询订单
rules:
- name: ruleName
  description: 规则描述，详细的规则逻辑
  related_behaviors:
  - behaviorName
  related_functions:
  - functionName
  display_name: 规则展示名称
  rule_type: 规则类型
  position: 前置/后置
processes:
- name: processName
  display_name: 流程展示名称
  goal: 流程目标
  description: 流程描述
  steps:
  - current_action: behaviorName
    previous_action: ''
    description: 步骤描述
    connection_type: 串行
securities:
- action_name: behaviorName
  audit_node: 前置
  audit_content: 审核内容描述
