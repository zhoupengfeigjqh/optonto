concepts:
- name: RawMaterial
  description: 生产物料
  attributes:
  - name: attr1
    type: string
    required: true
    display_name: 属性一
  - name: attr2
    type: number
    required: false
    display_name: 属性二
  display_name: 原材料
- name: RawMaterialInv
  description: 原材料当前的待入库、可用库存和累计库存
  attributes:
  - name: 原材料编号
    type: string
    required: true
    display_name: ''
  - name: 原材料名称
    type: string
    required: true
    display_name: ''
  - name: 材料类型
    type: string
    required: true
    display_name: ''
  - name: 待入库量
    type: number
    required: true
    display_name: ''
  - name: 累计库存量
    type: number
    required: true
    display_name: ''
  - name: 可用库存
    type: number
    required: true
    display_name: ''
  - name: 单位
    type: string
    required: true
    display_name: ''
  display_name: 原材料库存
- name: PurchaseRecord
  description: 原材料的采购记录，关联供应商和客户订单
  attributes:
  - name: 采购单号
    type: string
    required: true
    display_name: ''
  - name: 原材料编号
    type: string
    required: true
    display_name: ''
  - name: 原材料名称
    type: string
    required: true
    display_name: ''
  - name: 采购时间
    type: date
    required: true
    display_name: ''
  - name: 到位时间
    type: date
    required: true
    display_name: ''
  - name: 到位数量
    type: number
    required: true
    display_name: ''
  - name: 单位
    type: string
    required: true
    display_name: ''
  - name: 等待周期
    type: number
    required: true
    display_name: ''
  - name: 供应商名称
    type: string
    required: true
    display_name: ''
  - name: 关联订单编号
    type: string
    required: false
    display_name: ''
  - name: 关联订单名称
    type: string
    required: false
    display_name: ''
  display_name: 原材料采购记录
- name: Supplier
  description: 原材料的供应方
  attributes:
  - name: 供应商名称
    type: string
    required: true
    display_name: ''
  - name: 地址
    type: string
    required: false
    display_name: ''
  - name: 联系人
    type: string
    required: false
    display_name: ''
  - name: 联系电话
    type: string
    required: false
    display_name: ''
  - name: 原材料编号
    type: string
    required: true
    display_name: ''
  - name: 原材料名称
    type: string
    required: true
    display_name: ''
  - name: 采购周期
    type: number
    required: true
    display_name: ''
  display_name: 供应商
- name: CustOrder
  description: 客户的销售订单或询单，驱动原材料采购的源头
  attributes:
  - name: 订单编号
    type: string
    required: true
    display_name: ''
  - name: 订单名称
    type: string
    required: true
    display_name: ''
  - name: 订单批次号
    type: string
    required: false
    display_name: ''
  - name: 订单缓冲周期
    type: number
    required: false
    display_name: ''
  - name: 订单类型
    type: string
    required: true
    display_name: ''
  display_name: 客户订单
relations:
- name: hasRawInventory
  source: RawMaterial
  target: RawMaterialInv
  cardinality: '1:1'
  description: 每个原材料对应一条库存快照
  display_name: 原材料-库存
- name: recordsRawMaterial
  source: PurchaseRecord
  target: RawMaterial
  cardinality: N:1
  description: 1个原材料可有多个采购，1个采购记录只关联1个原材料
  display_name: 采购记录-原材料
- name: orderedFromSupplier
  source: PurchaseRecord
  target: Supplier
  cardinality: N:1
  description: 1个供应商对应多个采购单，1个采购单只有1个供应商
  display_name: 采购-供应商
- name: suppliesRawMaterial
  source: Supplier
  target: RawMaterial
  cardinality: N:M
  description: 1个供应商可供应多个原材料，1个原材料可来自多个供应商
  display_name: 供应商供应原材料
- name: containsPurchaseRecord
  source: CustOrder
  target: PurchaseRecord
  cardinality: 1:N
  description: 1个采购记录最多关联1个订单，1个订单可关联多个采购记录
  display_name: 订单包含采购
behaviors:
- name: CreatePurchaseOrder
  type: CREATE
  description: 智能体或用户创建原材料采购订单
  protocol: HTTP
  url: /api/purchase/create
  sql_code: ''
  method: POST
  params:
    rawMaterialId: string
    rawMaterialName: string
    quantity: number
    supplier: string
    deliveryDate: string
    customerOrderId: string
  related_concepts:
  - RawMaterial
  - Supplier
  - CustOrder
  display_name: 创建原材料采购单
- name: CancelPurchaseOrder
  type: DELETE
  description: 智能体或用户取消原材料采购订单
  protocol: HTTP
  url: /api/purchase/cancel
  sql_code: ''
  method: POST
  params:
    purchaseId: string
  related_concepts:
  - PurchaseRecord
  display_name: 取消原材料采购单
- name: WarehouseIn
  type: UPDATE
  description: 智能体或用户确认原材料到货入库
  protocol: HTTP
  url: /api/purchase/warehouse
  sql_code: ''
  method: POST
  params:
    purchaseId: string
  related_concepts:
  - PurchaseRecord
  - RawMaterialInv
  display_name: 原材料入库
- name: QueryRawMaterialInv
  type: READ
  description: 智能体或用户查询原材料库存
  protocol: HTTP
  url: /api/inventory/raw-material
  sql_code: ''
  method: GET
  params:
    rawMaterialId: string
    rawMaterialName: string
  related_concepts:
  - RawMaterialInv
  display_name: 查询原材料库存
- name: QueryPurchaseOrder
  type: READ
  description: 智能体或用户查询原材料采购单
  protocol: HTTP
  url: /api/purchase/orders
  sql_code: ''
  method: GET
  params:
    purchaseId: string
    rawMaterialId: string
    rawMaterialName: string
  related_concepts:
  - PurchaseRecord
  display_name: 查询采购单
- name: QueryRawMaterial
  type: READ
  description: 智能体或用户查询原材料基本信息
  protocol: HTTP
  url: /api/raw-material
  sql_code: ''
  method: GET
  params:
    rawMaterialId: string
    rawMaterialName: string
  related_concepts:
  - RawMaterial
  display_name: 查询原材料信息
- name: QuerySupplier
  type: READ
  description: 智能体或用户查询供应商信息
  protocol: HTTP
  url: /api/suppliers
  sql_code: ''
  method: GET
  params:
    supplierName: string
    rawMaterialId: string
  related_concepts:
  - Supplier
  display_name: 查询供应商信息
rules:
- id: 1
  name: UnitConsistencyPO
  description: 采购记录.单位 必须等于 原材料.单位
  related_concepts:
  - PurchaseRecord
  - RawMaterial
  display_name: 采购与原料单位一致性校验
  rule_type: ''
- id: 2
  name: UnitConsistencyInv
  description: 库存.单位 必须等于 原材料.单位
  related_concepts:
  - RawMaterialInv
  - RawMaterial
  display_name: 库存与原料单位一致性校验
  rule_type: ''
- id: 3
  name: DeliveryTimeValid
  description: 到位时间 > 采购时间
  related_concepts:
  - PurchaseRecord
  display_name: 到位时间合理性校验
  rule_type: ''
- id: 4
  name: MaterialExistsPO
  description: 采购记录.原材料名称 必须存在于 原材料
  related_concepts:
  - PurchaseRecord
  - RawMaterial
  display_name: 采购原料存在性校验
  rule_type: ''
- id: 5
  name: SupplierExistsPO
  description: 采购记录.供应商名称 必须存在于 供应商
  related_concepts:
  - PurchaseRecord
  - Supplier
  display_name: 采购供应商存在性校验
  rule_type: ''
- id: 6
  name: OrderExistsPO
  description: 采购记录.关联订单编号非空时，必须存在于 客户订单
  related_concepts:
  - PurchaseRecord
  - CustOrder
  display_name: 采购订单存在性校验
  rule_type: ''
- id: 7
  name: SafetyStockWarn
  description: 库存.可用库存量 < 原材料.安全库存，推送原材料采购或转库存预警
  related_concepts:
  - RawMaterialInv
  - RawMaterial
  display_name: 安全库存预警
  rule_type: ''
- id: 8
  name: DeliveryOverdueWarn
  description: 当前日期 >= 采购记录.到位时间，提示用户是否启动入库操作
  related_concepts:
  - PurchaseRecord
  display_name: 采购到位超期预警
  rule_type: ''
- id: 9
  name: PurchaseReasonInfer
  description: 采购记录.关联订单编号为空 -> 该采购为补充库存
  related_concepts:
  - PurchaseRecord
  - CustOrder
  display_name: 采购目的推理
  rule_type: ''
- id: 10
  name: OrderLinkCheck
  description: 采购记录.关联订单编号不在客户订单表中 -> 提示用户该客户订单可能已取消
  related_concepts:
  - PurchaseRecord
  - CustOrder
  display_name: 采购关联订单校验
  rule_type: ''
- id: 11
  name: RT1
  description: x
  related_concepts: []
  display_name: ''
  rule_type: validation
events:
- name: PurchaseOrderCreated
  description: 原材料采购订单创建
  related_behavior: CreatePurchaseOrder
  trigger_behavior: QueryRawMaterialInv
  display_name: 采购订单创建事件
- name: PurchaseOrderCancelled
  description: 原材料采购订单取消
  related_behavior: CancelPurchaseOrder
  trigger_behavior: QueryRawMaterialInv
  display_name: 采购订单取消事件
- name: RawMaterialWarehoused
  description: 原材料入库确认
  related_behavior: WarehouseIn
  trigger_behavior: QueryRawMaterialInv
  display_name: 原材料入库事件
business_processes: []
