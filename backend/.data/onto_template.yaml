# 本体 YAML 模板 — 严格遵循此格式输出
metadata:
  name: ''
  source_file: ''
  source_thread: ''
  created_at: ''

concepts:
- name: ConceptName
  description: 概念描述
  attributes:
  - name: attrName
    type: string
    required: true
    display_name: 属性展示名称
    example: 示例值
    constraint: ''
  display_name: 概念展示名称

relations:
- name: relationName
  source: SourceConcept
  target: TargetConcept
  cardinality: 1:N
  description: 关系描述
  display_name: 关系展示名称

behaviors:
- name: behaviorName
  description: 行为描述
  url: /api/path
  method: POST
  params:
    tradeId:
      type: string
      description: 参数描述
      required: true
      example: 示例值
    status: 
      type: "string",
      enum: ["active", "inactive", "suspended"]
      description: 参数描述
      required: true
      example: 示例值
    user:
      type: object
      description: 参数描述
      required: true
      properties:
        id:
          type: string
          description: 参数描述
          example: 示例值
        name:
          type: string
          description: 参数描述
          example: 示例值
    tags:
      type: array
      description: 参数描述
      required: false
      items:
        type: string
        description: 参数描述
        example: 示例值
    products:
      type: array
      description: 参数描述
      required: true
      items:
        type: object
        properties:
          sku:
            type: string
            description: 参数描述
            example: 示例值
          quantity:
            type: number
            description: 参数描述
            example: 示例值
  response:
    code:
      type: number
      example: 0
    data:
      type: object
      properties:
        orderId:
          type: string
          description: 字段描述
          example: 示例值
        total:
          type: number
          description: 字段描述
          example: 示例值
  related_concepts:
  - ConceptName
  display_name: 行为展示名称

rules:
- name: ruleName
  description: 规则描述
  related_behaviors:
  - behaviorName
  display_name: 规则展示名称
  rule_type: 验证规则
  position: ''

events:
- name: eventName
  event_type: 动作执行
  trigger_condition: 触发条件描述
  related_concepts:
  - ConceptName
  related_behavior: behaviorName
  trigger_behaviors: []
  display_name: 事件展示名称

processes:
- name: processName
  display_name: 流程展示名称
  goal: 流程目标
  description: 流程描述
  steps:
  - current_action: behaviorName
    previous_action: ''
    description: 步骤描述
    connection_type: 串行

securities:
- action_name: behaviorName
  audit_node: 前置
  audit_content: 审核内容描述