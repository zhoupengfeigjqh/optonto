# 本体 YAML 模板 — 严格遵循此格式输出
metadata:
  name: ''
  source_file: ''
  source_thread: ''
  created_at: ''

concepts:
- name: ConceptName
  display_name: 概念描述
  attributes:
  - name: attrName
    type: string
    required: true
    display_name: 属性展示名称
    example: 示例值
    constraint: ''
  display_name: 概念展示名称

relations:
- name: relationName
  source: SourceConcept
  target: TargetConcept
  cardinality: 1:N
  display_name: 关系描述
  display_name: 关系展示名称

functions:
- name: sumRawNotArrivalQty
  display_name: 采购原材料未到位总数
  display_name: 根据原材料的采购单信息，将到位时间大于当前时间的原材料，对其到位数求和
  related_attributes:
  - PurchaseRecord.arrivalQuantity
  - PurchaseRecord.arrivalTime
  - PurchaseRecord.rawMaterialName
  params:
    purchaseRecordSet:
      type: array
      items:
        type: object
        properties:
          arrivalTime:
            type: string
            display_name: 到位时间
            example: '2026-09-01'
          rawMaterialName:
            type: string
            display_name: 原材料名称
            example: 高强度钢板
          arrivalQuantity:
            type: number
            display_name: 计划的到位数量
            example: 100
  response:
    result:
      type: array
      items:
        type: object
        properties:
          rawMaterialName:
            type: string
            display_name: 原材料名称
            example: 高强度钢板
          sumNotArrivalQty:
            type: number
            display_name: 还未到位的采购量
            example: 100

behaviors:
- name: behaviorName
  display_name: 行为描述
  params:
    tradeId:
      type: string
      display_name: 参数描述
      required: true
      example: 示例值
    status: 
      type: "string",
      enum: ["active", "inactive", "suspended"]
      display_name: 参数描述
      required: true
      example: 示例值
    user:
      type: object
      display_name: 参数描述
      required: true
      properties:
        id:
          type: string
          display_name: 参数描述
          example: 示例值
        name:
          type: string
          display_name: 参数描述
          example: 示例值
    tags:
      type: array
      display_name: 参数描述
      required: false
      items:
        type: string
        display_name: 参数描述
        example: 示例值
    products:
      type: array
      display_name: 参数描述
      required: true
      items:
        type: object
        properties:
          sku:
            type: string
            display_name: 参数描述
            example: 示例值
          quantity:
            type: number
            display_name: 参数描述
            example: 示例值
  response:
    code:
      type: number
      example: 0
    data:
      type: object
      properties:
        orderId:
          type: string
          display_name: 字段描述
          example: 示例值
        total:
          type: number
          display_name: 字段描述
          example: 示例值
  related_concepts:
  - ConceptName
  display_name: 行为展示名称

rules:
- name: ruleName
  display_name: 规则描述
  related_behaviors:
  - behaviorName
  display_name: 规则展示名称
  rule_type: 验证规则
  position: ''

events:
- name: eventName
  event_type: 动作执行
  trigger_condition: 触发条件描述
  related_concepts:
  - ConceptName
  related_behavior: behaviorName
  trigger_behaviors: []
  display_name: 事件展示名称

processes:
- name: processName
  display_name: 流程展示名称
  goal: 流程目标
  display_name: 流程描述
  steps:
  - current_action: behaviorName
    previous_action: ''
    display_name: 步骤描述
    connection_type: 串行

securities:
- action_name: behaviorName
  audit_node: 前置
  audit_content: 审核内容描述