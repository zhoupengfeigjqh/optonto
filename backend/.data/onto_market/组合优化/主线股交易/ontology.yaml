metadata:
  name: 游资交易策略本体
  source_file: 热点交易需求分析.md
  source_thread: 游资交易策略
  created_at: '2026-07-21 12:04:04'
concepts:
- name: Market
  description: 代表整个A股市场，是市场状态的载体。
  attributes:
  - name: marketId
    type: string
    display_name: 市场ID
    example: MKT_A_SHARE
    constraint: 非空，唯一
  - name: marketName
    type: string
    display_name: 市场名称
    example: A股市场
    constraint: 非空
  display_name: 市场
- name: Stock
  description: A股市场上的单只股票，是交易决策的基本标的。
  attributes:
  - name: stockId
    type: string
    display_name: 股票代码
    example: 000858
    constraint: 非空，唯一，格式：6位数字
  - name: stockName
    type: string
    display_name: 股票名称
    example: 五粮液
    constraint: 非空
  - name: price
    type: number
    display_name: 现价
    example: '150.5'
    constraint: '> 0'
  - name: dailyChangePercent
    type: number
    display_name: 当日涨幅
    example: '10.0'
    constraint: 无约束，表示百分比
  - name: isLimitUp
    type: boolean
    display_name: 是否涨停
    example: 'True'
    constraint: 非空
  - name: isUnderRegulation
    type: boolean
    display_name: 是否受监管
    example: 'False'
    constraint: 非空
  - name: isAliveStock
    type: boolean
    display_name: 是否为活口
    example: 'True'
    constraint: 非空
  - name: timingStatus
    type: enum
    display_name: 时机状态
    example: 分歧转一致
    constraint: '枚举: 分歧, 一致, 分歧转一致, 其他'
  - name: sectorId
    type: string
    display_name: 所属板块ID
    example: HS_AI_2024
    constraint: 非空，关联HotSector.hotSectorId
  display_name: 股票
- name: HotSector
  description: 当前市场资金高度关注、持续上涨的行业或概念板块。
  attributes:
  - name: hotSectorId
    type: string
    display_name: 热点板块ID
    example: HS_AI_2024
    constraint: 非空，唯一
  - name: sectorName
    type: string
    display_name: 板块名称
    example: 人工智能
    constraint: 非空
  - name: leadStockId
    type: string
    display_name: 龙头股票代码
    example: '002230'
    constraint: 关联Stock.stockId
  - name: sectorHeatScore
    type: number
    display_name: 板块热度评分
    example: '85'
    constraint: 0-100
  display_name: 热点板块
- name: MarketState
  description: 对当前市场整体情绪、风险水平和结构特征的综合性描述。
  attributes:
  - name: stateId
    type: string
    display_name: 市场状态ID
    example: MS_20231027
    constraint: 非空，唯一
  - name: sentimentLevel
    type: enum
    display_name: 情绪等级
    example: 升温
    constraint: '枚举: 恐慌, 低迷, 温和, 升温, 高潮, 退潮'
  - name: riskLevel
    type: enum
    display_name: 风险等级
    example: 中
    constraint: '枚举: 低, 中, 高'
  - name: isStructureAdjustmentDay
    type: boolean
    display_name: 是否结构调整日
    example: 'False'
    constraint: 非空
  - name: isPolicyAdjustmentDay
    type: boolean
    display_name: 是否政策调控日
    example: 'False'
    constraint: 非空
  display_name: 市场状态
- name: TradingDecision
  description: 系统根据分析和规则生成的，针对特定股票的具体操作建议。
  attributes:
  - name: decisionId
    type: string
    display_name: 决策ID
    example: TD_AI_20231027_001
    constraint: 非空，唯一
  - name: stockId
    type: string
    display_name: 目标股票代码
    example: '002230'
    constraint: 非空，关联Stock.stockId
  - name: actionType
    type: enum
    display_name: 操作类型
    example: 买入
    constraint: '枚举: 买入, 卖出, 持仓, 空仓'
  - name: suggestedPosition
    type: number
    display_name: 建议仓位比例
    example: '30.0'
    constraint: 0-100，表示百分比
  display_name: 交易决策
- name: RiskRule
  description: 预定义的、用于识别和规避市场及个股风险的规则。
  attributes:
  - name: ruleId
    type: string
    display_name: 规则ID
    example: RR_AVOID_REGULATION
    constraint: 非空，唯一
  - name: ruleName
    type: string
    display_name: 规则名称
    example: 避开监管票
    constraint: 非空
  - name: ruleType
    type: enum
    display_name: 规则类型
    example: 验证规则
    constraint: '枚举: 验证规则, 推理规则'
  - name: ruleDescription
    type: string
    display_name: 规则描述
    example: 如果股票受监管，则不能买入
    constraint: 非空
  - name: priority
    type: number
    display_name: 优先级
    example: '90'
    constraint: 1-100，数值越大优先级越高
  display_name: 风险规则
- name: MarketEvent
  description: 可能影响市场情绪或个股走势的外部事件，如政策发布、监管警示等。
  attributes:
  - name: eventId
    type: string
    display_name: 事件ID
    example: ME_POLICY_20231027
    constraint: 非空，唯一
  - name: eventName
    type: string
    display_name: 事件名称
    example: 降印花税
    constraint: 非空
  - name: eventType
    type: enum
    display_name: 事件类型
    example: 政策
    constraint: '枚举: 政策, 监管, 消息, 盘面'
  - name: eventImpact
    type: string
    display_name: 事件影响
    example: 利好，可能引发市场情绪升温
    constraint: 非空
  display_name: 市场事件
relations:
- name: hasState
  source: Market
  target: MarketState
  cardinality: 1:N
  description: 市场在某一时刻只有一个状态。
  display_name: 具有状态
- name: belongsTo
  source: Stock
  target: HotSector
  cardinality: N:1
  description: 一只股票属于一个热点板块。关联：Stock.sectorId -> HotSector.hotSectorId。
  display_name: 属于
- name: isLeadOf
  source: Stock
  target: HotSector
  cardinality: 1:N
  description: 一个龙头股引领一个板块。关联：HotSector.leadStockId -> Stock.stockId。
  display_name: 是...的龙头
- name: isBasisFor
  source: MarketState
  target: TradingDecision
  cardinality: 1:N
  description: 一个市场状态是多个交易决策的依据。
  display_name: 是...的基础
- name: targets
  source: TradingDecision
  target: Stock
  cardinality: N:1
  description: 一个交易决策针对一只股票。关联：TradingDecision.stockId -> Stock.stockId。
  display_name: 针对
- name: triggers
  source: MarketEvent
  target: MarketState
  cardinality: 1:N
  description: 一个市场事件可以触发多个市场状态变化。
  display_name: 触发
- name: isCheckedBy
  source: TradingDecision
  target: RiskRule
  cardinality: N:M
  description: 一个交易决策需要被多个风险规则检查。
  display_name: 被...检查
functions:
- name: CalculateSectorHeat
  display_name: 计算板块热度
  description: 根据板块内涨停个股数量、龙头涨幅、板块整体涨幅等，计算一个综合热度评分。
  related_attributes:
  - Stock.isLimitUp
  - Stock.dailyChangePercent
  - HotSector.hotSectorId
  params:
    stocks:
      type: array
      items:
        type: object
        properties:
          isLimitUp:
            type: boolean
            description: 是否涨停
            example: true
          dailyChangePercent:
            type: number
            description: 当日涨幅
            example: 10.0
          hotSectorId:
            type: string
            description: 所属板块ID
            example: HS_AI_2024
  response:
    result:
      type: object
      properties:
        sectorHeatScore:
          type: number
          description: 0-100的热度评分
          example: 85
behaviors:
- name: IdentifyMainSector
  description: 分析所有热点板块，根据热度、持续性、龙头强度等，动态确定当前市场的主线板块。
  params:
    sectors:
      type: array
      items:
        type: object
        properties:
          hotSectorId:
            type: string
            description: 热点板块ID
            example: HS_AI_2024
          sectorHeatScore:
            type: number
            description: 板块热度评分
            example: 85
      description: 待分析的热点板块列表
      required: true
  response:
    code:
      type: number
      example: 0
    data:
      type: object
      properties:
        mainSectorId:
          type: string
          description: 主线板块ID
          example: HS_AI_2024
  related_concepts:
  - HotSector
  - MarketState
  display_name: 识别主线板块
- name: SelectStrongStock
  description: 在指定板块内，根据涨幅、涨停时间、封单量、是否为活口等指标，筛选出最强的个股（龙头或活口）。
  params:
    sectorId:
      type: string
      description: 板块ID
      required: true
      example: HS_AI_2024
  response:
    code:
      type: number
      example: 0
    data:
      type: object
      properties:
        strongStockIds:
          type: array
          items:
            type: string
            description: 股票代码
            example: '002230'
  related_concepts:
  - Stock
  - HotSector
  display_name: 选强股
- name: AssessTiming
  description: 判断个股当前所处的时机状态（分歧/一致/分歧转一致/其他），并评估是否为关键买点。
  params:
    stockId:
      type: string
      description: 股票代码
      required: true
      example: '002230'
  response:
    code:
      type: number
      example: 0
    data:
      type: object
      properties:
        timingStatus:
          type: string
          description: 分歧/一致/分歧转一致/其他
          example: 分歧转一致
        isBuyPoint:
          type: boolean
          description: 是否为买点
          example: true
  related_concepts:
  - Stock
  - MarketState
  display_name: 评估时机
- name: CalculatePosition
  description: 根据市场状态、风险等级和个股确定性，计算建议的仓位比例。
  params:
    marketStateId:
      type: string
      description: 市场状态ID
      required: true
      example: MS_20231027
    stockId:
      type: string
      description: 股票代码
      required: true
      example: '002230'
  response:
    code:
      type: number
      example: 0
    data:
      type: object
      properties:
        suggestedPosition:
          type: number
          description: 建议仓位比例
          example: 30.0
  related_concepts:
  - MarketState
  - RiskRule
  display_name: 计算仓位
- name: GenerateDecision
  description: 综合选股、择时和仓位计算的结果，生成最终的交易决策（买入/卖出/持仓/空仓）。
  params:
    stockId:
      type: string
      description: 股票代码
      required: true
      example: '002230'
    actionType:
      type: string
      description: 操作类型
      required: true
      example: 买入
    position:
      type: number
      description: 仓位比例
      required: true
      example: 30.0
  response:
    code:
      type: number
      example: 0
    data:
      type: object
      properties:
        decisionId:
          type: string
          description: 决策ID
          example: TD_AI_20231027_001
  related_concepts:
  - Stock
  - MarketState
  - TradingDecision
  display_name: 生成决策
- name: CheckRisk
  description: 针对一个或多个风险规则，检查当前市场状态或个股是否符合触发条件。
  params:
    stockId:
      type: string
      description: 股票代码
      required: true
      example: '002230'
    marketStateId:
      type: string
      description: 市场状态ID
      required: true
      example: MS_20231027
  response:
    code:
      type: number
      example: 0
    data:
      type: object
      properties:
        triggeredRuleIds:
          type: array
          items:
            type: string
            description: 触发的规则ID
            example: RR_AVOID_REGULATION
        isRiskOn:
          type: boolean
          description: 是否有风险
          example: true
  related_concepts:
  - RiskRule
  - Stock
  - MarketState
  display_name: 检查风险
- name: AssessMarketSentiment
  description: 根据全市场涨停家数、炸板率、连板高度、指数涨幅等，综合判断当前情绪等级。
  params:
    marketSnapshot:
      type: object
      description: 包含全市场关键指标的数据包
      required: true
      properties:
        limitUpCount:
          type: number
          description: 涨停家数
          example: 50
        limitDownCount:
          type: number
          description: 跌停家数
          example: 5
        zhaBanRate:
          type: number
          description: 炸板率
          example: 0.2
        highestBoard:
          type: number
          description: 最高连板数
          example: 5
        indexChangePercent:
          type: number
          description: 指数涨幅
          example: 1.5
  response:
    code:
      type: number
      example: 0
    data:
      type: object
      properties:
        sentimentLevel:
          type: string
          description: 恐慌/低迷/温和/升温/高潮/退潮
          example: 升温
  related_concepts:
  - Stock
  - MarketState
  display_name: 评估市场情绪
rules:
- name: AvoidRegulationStock
  description: 对于TradingDecision的目标Stock，如果其isUnderRegulation为true，则不能对其生成买入决策。
  related_behaviors:
  - GenerateDecision
  related_functions: []
  display_name: 避开监管票
  rule_type: 验证规则
  position: 前置（约束）
- name: AvoidHighChaoSector
  description: 如果市场状态sentimentLevel为“高潮”，且股票所属板块是当前主线，则不能新买入该板块股票。
  related_behaviors:
  - GenerateDecision
  related_functions: []
  display_name: 高潮期不买板块股
  rule_type: 验证规则
  position: 前置（约束）
- name: PolicyAdjustmentReduce
  description: IF 市场状态isPolicyAdjustmentDay为true，THEN 建议仓位suggestedPosition应 <= 20%。
  related_behaviors:
  - CalculatePosition
  related_functions: []
  display_name: 政策调控日轻仓
  rule_type: 推理规则
  position: 后置（检验）
- name: MarketExitOnRetreat
  description: IF 市场状态sentimentLevel为“退潮”，THEN 决策actionType应为“空仓”。
  related_behaviors:
  - GenerateDecision
  related_functions: []
  display_name: 市场退潮离场
  rule_type: 推理规则
  position: 后置（检验）
- name: StructureAdjustFocus
  description: IF 市场状态isStructureAdjustmentDay为true且sentimentLevel非“高潮”，THEN 只允许对主线板块的股票生成买入决策。
  related_behaviors:
  - GenerateDecision
  related_functions: []
  display_name: 结构调整日聚焦主线
  rule_type: 推理规则
  position: 前置（约束）
events:
- name: DailyMarketOpen
  event_type: 动作执行
  trigger_condition: 每日A股市场开盘时间（9:30）到达。
  related_concepts:
  - Market
  - MarketState
  related_behavior: IdentifyMainSector
  trigger_behaviors: []
  display_name: 每日开盘
- name: PolicyAnnouncement
  event_type: 动作执行
  trigger_condition: 监控到来自权威渠道的重大政策（如降印花税、调整保证金比例）。
  related_concepts:
  - MarketEvent
  - MarketState
  related_behavior: CheckRisk
  trigger_behaviors: []
  display_name: 重大政策发布
- name: SectorLimitUpSurge
  event_type: 状态变化
  trigger_condition: 某个热点板块的涨停个股数在短时间内（如30分钟）激增，超过阈值（如10只）。
  related_concepts:
  - HotSector
  - Stock
  related_behavior: AssessMarketSentiment
  trigger_behaviors: []
  display_name: 板块涨停潮
- name: SectorCollectiveLimitDown
  event_type: 状态变化
  trigger_condition: 热点板块内多个龙头股或核心股同时打开涨停板，并快速下跌。
  related_concepts:
  - Stock
  - MarketState
  related_behavior: CheckRisk
  trigger_behaviors: []
  display_name: 热点集体炸板
- name: RegulatoryWarningIssued
  event_type: 动作执行
  trigger_condition: 交易所对某只股票发布交易监管公告。
  related_concepts:
  - Stock
  - MarketEvent
  related_behavior: CheckRisk
  trigger_behaviors: []
  display_name: 个股监管警示
- name: SentimentTurningPointDetected
  event_type: 状态变化
  trigger_condition: 通过行为AssessMarketSentiment计算，市场情绪等级发生关键变化（如从“升温”变为“高潮”或“退潮”）。
  related_concepts:
  - MarketState
  related_behavior: ''
  trigger_behaviors: []
  display_name: 情绪拐点检测
processes:
- name: PreMarketStrategyGeneration
  display_name: 每日盘前策略生成流程
  goal: 在市场开盘前，基于昨日收盘数据和最新信息，生成当日的初步交易策略（选股、择时、仓位）。
  description: 该流程在每日开盘前执行一次。首先识别当前市场的主线板块，然后在主线板块内筛选出强势股，接着对候选强势股进行时机评估，并结合市场状态计算建议仓位，最后综合所有信息生成初步的交易决策列表。
  steps:
  - current_action: IdentifyMainSector
    previous_action: ''
    description: 分析所有热点板块数据，动态识别出当前市场的主线板块。
    connection_type: 串行
  - current_action: SelectStrongStock
    previous_action: IdentifyMainSector
    description: 基于识别出的主线板块ID，在该板块内筛选出最强的个股（龙头或活口）。
    connection_type: 串行
  - current_action: AssessTiming
    previous_action: SelectStrongStock
    description: 对上一步筛选出的每一只强股，评估其当前所处的时机状态（分歧/一致/分歧转一致/其他），判断是否为合适的买点。
    connection_type: 并行
  - current_action: CalculatePosition
    previous_action: AssessTiming
    description: 结合当前市场状态（情绪、风险等级）和对个股的评估，计算建议的仓位比例。
    connection_type: 串行
  - current_action: CheckRisk
    previous_action: CalculatePosition
    description: 对生成的候选决策，逐一进行风险规则检查（如避开监管票、高潮期限制等），按优先级处理规则冲突。
    connection_type: 串行
  - current_action: GenerateDecision
    previous_action: CheckRisk
    description: 综合所有信息，为通过风险检查的候选股票生成正式的“买入”或“持仓”交易决策。
    connection_type: 串行
- name: IntradayRiskControl
  display_name: 盘中风险控制流程
  goal: 在盘中实时监控市场状态变化，当触发风险规则时，及时生成风险应对决策（减仓/清仓/切换）。
  description: 该流程在盘中持续或定时触发。它监控市场事件和状态变化，一旦发现风险信号（如政策调控、市场退潮），立即执行风险检查，并生成相应的卖出或空仓决策。
  steps:
  - current_action: ''
    previous_action: ''
    description: 监控到市场事件发生（如政策发布）或市场状态指标达到阈值（如炸板率飙升）。
    connection_type: 串行
  - current_action: CheckRisk
    previous_action: ''
    description: 根据触发的事件或指标，调用对应的风险规则进行检查，确认风险等级和受影响范围，按优先级处理规则冲突。
    connection_type: 串行
  - current_action: CalculatePosition
    previous_action: CheckRisk
    description: 基于风险检查结果，重新计算当前持仓应调整到的安全仓位比例（如清仓则仓位为0）。
    connection_type: 串行
  - current_action: GenerateDecision
    previous_action: CalculatePosition
    description: 生成针对现有持仓的“卖出”或“空仓”决策。
    connection_type: 串行
securities:
- action_name: GenerateDecision
  audit_node: 前置
  audit_content: 审核决策的合理性：系统生成的买入/卖出决策，特别是“买入”决策，需要人工核对：1. 目标股票是否确实是当前主线板块的龙头或强股？2.
    当前的“时机”判断（分歧转一致）是否与盘面表现一致？3. 建议的仓位比例是否与个人风险承受能力匹配？4. 是否已排除所有已知的风险（如监管、退潮）？
- action_name: IdentifyMainSector
  audit_node: 前置
  audit_content: 审核主线判断：系统识别出的主线板块，需要人工确认其逻辑是否成立：1. 该板块是否有持续性消息或政策支持？2. 该板块内是否有足够多、足够强的个股支撑其主线地位？3.
    是否存在其他可能分流资金的竞争板块？
- action_name: CheckRisk
  audit_node: 后置
  audit_content: 审核风险触发：当系统触发“政策调控日”或“市场退潮”等高危风险时，需要人工复核：1. 触发条件的判断是否准确？是否误判？2. 系统建议的清仓或减仓操作是否过于激进？是否需要调整？
