# 独立 Nginx 入口容器配置（2026-08-26 从 optonto-frontend 合并镜像拆出）
# Nginx 监听 81 端口，为全站唯一入口：
#   /          → optonto-frontend:3000 (Next.js)
#   /api/      → optonto-core-backend:8001
#   /agent-api/ → optonto-agent-backend:8003
#   /mcp/      → optonto-ontology-mcp:8002
# 所有上游都不写 upstream 块（启动期一次解析会缓存旧 IP），
# 一律 resolver + 变量 proxy_pass：每次请求经 Docker 内嵌 DNS 运行时再解析，
# 任一下游容器 recreate（IP 变更）后自动跟随，不再因缓存旧 IP 而 502

server {
    listen 81;
    server_name localhost;

    # 前端页面 → Next.js 容器
    location / {
        resolver 127.0.0.11 valid=5s;
        set $frontend_upstream http://optonto-frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # API 文档（Swagger UI / ReDoc / OpenAPI schema）→ core-backend 容器
    # 精确匹配，优先级高于 location /；Swagger 页面会再拉 /openapi.json，三者缺一不可
    location = /docs {
        resolver 127.0.0.11 valid=5s;
        set $docs_upstream http://optonto-core-backend:8001;
        proxy_pass $docs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /redoc {
        resolver 127.0.0.11 valid=5s;
        set $redoc_upstream http://optonto-core-backend:8001;
        proxy_pass $redoc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /openapi.json {
        resolver 127.0.0.11 valid=5s;
        set $openapi_upstream http://optonto-core-backend:8001;
        proxy_pass $openapi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API 请求 → core-backend 容器
    location /api/ {
        resolver 127.0.0.11 valid=5s;
        set $core_upstream http://optonto-core-backend:8001;
        proxy_pass $core_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Agent API 请求 → agent-backend 容器（SSE 流式，同理运行时再解析）
    location /agent-api/ {
        resolver 127.0.0.11 valid=5s;
        set $agent_upstream http://optonto-agent-backend:8003;
        proxy_pass $agent_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # 本体查询 MCP 服务（平台内置对外工具面之一，只读查询）：/tools、/health、/mcp
    # → optonto-ontology-query-mcp:8002，剥掉 /mcp/ 前缀转发
    # 前端拉查询工具清单走这里，不再浏览器直连 :8002
    location /mcp/ {
        resolver 127.0.0.11 valid=5s;
        # 注意顺序：set 必须先于 rewrite——break 会中断同块内后续 rewrite 模块指令（set 属之），
        # 否则变量为空，proxy_pass 报 invalid URL prefix
        set $mcp_upstream http://optonto-ontology-query-mcp:8002;
        rewrite ^/mcp/(.*)$ /$1 break;
        proxy_pass $mcp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # 公共函数 MCP 服务（平台通用算力，发布 + 执行一体）：/tools、/health、/mcp
    # → optonto-common-function-mcp:8007，剥掉 /mcp-common-function/ 前缀转发
    # 外部客户端经此连接即可调用 filterData / aggregateData / dateDiff 等公共函数
    location /mcp-common-function/ {
        resolver 127.0.0.11 valid=5s;
        set $cf_upstream http://optonto-common-function-mcp:8007;
        rewrite ^/mcp-common-function/(.*)$ /$1 break;
        proxy_pass $cf_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # 数据引擎执行服务（8005）：**不对外代理**（2026-10-04 语义收敛）——
    # 它是执行底座，工具面仅供平台 Agent 内网挂载；对外提供行为能力只走「自建发布」
    # （动态容器，独立端口 + 令牌）。原 /mcp-data-engine/ location 已下线。
}
