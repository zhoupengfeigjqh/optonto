# Nginx + Next.js 合并部署配置
# Nginx 监听 81 端口，Next.js 在本机 :3000
# 后端上游不写 upstream 块（启动期一次解析会缓存旧 IP），在各 location 内用 resolver + 变量运行时再解析

server {
    listen 81;
    server_name localhost;

    # 前端页面 → 本机 Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # API 请求 → 后端容器
    # resolver + 变量 proxy_pass：每次请求经 Docker 内嵌 DNS 运行时再解析，
    # 后端容器 recreate（IP 变更）后自动跟随，不再因 upstream 启动期缓存旧 IP 而 502
    location /api/ {
        resolver 127.0.0.11 valid=5s;
        set $core_upstream http://optonto-core-backend:8001;
        proxy_pass $core_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Agent API 请求 → agent-backend 容器（同理运行时再解析）
    location /agent-api/ {
        resolver 127.0.0.11 valid=5s;
        set $agent_upstream http://optonto-agent-backend:8003;
        proxy_pass $agent_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
