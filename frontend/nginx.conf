# Nginx + Next.js 合并部署配置
# Nginx 监听 81 端口，Next.js 在本机 :3000

upstream backend_api {
    server optonto-core-backend:8001;
}

upstream agent_backend_api {
    server optonto-agent-backend:8003;
}

server {
    listen 81;
    server_name localhost;

    # 前端页面 → 本机 Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # API 请求 → 后端容器
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Agent API 请求 → agent-backend 容器
    location /agent-api/ {
        proxy_pass http://agent_backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
